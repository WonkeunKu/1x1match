<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title desc">
  <title id="title">1VS1매치 로고</title>
  <desc id="desc">검붉은 X 위에 VS 글자가 놓인 1VS1매치 로고</desc>
  <defs>
    <linearGradient id="bg" x1="6" y1="6" x2="58" y2="58" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#070505"/>
      <stop offset="0.58" stop-color="#160909"/>
      <stop offset="1" stop-color="#781419"/>
    </linearGradient>
    <linearGradient id="slashA" x1="32" y1="4" x2="32" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#050404"/>
      <stop offset="0.45" stop-color="#641317"/>
      <stop offset="1" stop-color="#c52a30"/>
    </linearGradient>
    <linearGradient id="slashB" x1="32" y1="4" x2="32" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#050404"/>
      <stop offset="0.42" stop-color="#4b1013"/>
      <stop offset="1" stop-color="#9e1d22"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="8" flood-color="#b51f24" flood-opacity="0.35"/>
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.7"/>
    </filter>
  </defs>
  <rect x="4" y="4" width="56" height="56" rx="10" fill="url(#bg)"/>
  <rect x="4.5" y="4.5" width="55" height="55" rx="9.5" fill="none" stroke="#ff4a39" stroke-opacity="0.24"/>
  <g filter="url(#shadow)">
    <rect x="27" y="3" width="10" height="58" rx="5" fill="url(#slashA)" transform="rotate(31 32 32)"/>
    <rect x="27" y="3" width="10" height="58" rx="5" fill="url(#slashB)" transform="rotate(-31 32 32)"/>
  </g>
  <text
    x="32"
    y="38"
    text-anchor="middle"
    font-family="Arial, Helvetica, sans-serif"
    font-size="18"
    font-weight="900"
    letter-spacing="0"
    fill="#fff8ef"
  >VS</text>
</svg>
