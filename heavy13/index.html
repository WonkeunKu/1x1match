<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>무거운 13 · 1x1 MATCH</title>
<script src="/pv.js?v=1" defer></script>
<meta name="description" content="데블스플랜 감옥 매치 무거운 13을 온라인으로. 5~7인, 빈자리는 AI가 채워요.">
<script src="/freeplay.js?v=4"></script>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Mono:wght@500;600&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* 무거운 13: 어두운 밤하늘 보라 + 세리프 숫자. 위에서부터 방 코드 → 라운드 → 플레이어 카드 → 받침대 3개 → 내 패 → 벌점 순위 */
:root {
  --bg: #10302a; --card: #0b2420; --card-2: #163d35; --line: rgba(241,238,228,.14); --line-2: rgba(241,238,228,.22);
  --text: #f1eee4; --dim: #a7bcb2; --faint: #6f8a80; --accent: #f3b641; --accent-ink: #1a1405; --gold: #f3b641; --danger: #e8604a; --ok: #a9d774; --devil: #b8a6f2;
  --R: #c7343c; --G: #2e9e5b; --B: #3e7fd6; --stone: #f1eee4; --stone-ink: #10302a;
  --f-num: "IBM Plex Mono", ui-monospace, Menlo, monospace; --f-serif: "Black Han Sans", "Noto Sans KR", "Apple SD Gothic Neo", sans-serif; --f-body: "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { background: #071815; }
body { margin: 0; min-height: 100vh; color: var(--text); font-family: var(--f-body); font-size: 15px; line-height: 1.45;
  background-color: var(--bg);
  background-image: repeating-linear-gradient(90deg, transparent 0 79px, rgba(0,0,0,.1) 79px 80px), repeating-linear-gradient(0deg, transparent 0 79px, rgba(0,0,0,.08) 79px 80px);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.wrap { max-width: 600px; margin: 0 auto; padding-block: max(14px, env(safe-area-inset-top, 0px)) 40px; display: grid; gap: 18px; }
button { font: inherit; color: inherit; cursor: pointer; border: 1px solid var(--line-2); background: var(--card-2); border-radius: 12px; padding: 11px 16px; font-weight: 700; }
button:disabled { cursor: not-allowed; opacity: .45; }
button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.btn-main { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-size: 17px; padding: 15px 18px; border-radius: 14px; width: 100%; }
.btn-main:disabled { background: #5b5130; border-color: #5b5130; color: #bfb390; opacity: 1; }
.icon { width: 46px; height: 46px; padding: 0; display: grid; place-items: center; border-radius: 12px; background: var(--card-2); }
.icon svg { width: 22px; height: 22px; stroke: var(--text); fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
input { font: inherit; font-size: 16px; color: var(--text); background: var(--bg); border: 1px solid var(--line-2); border-radius: 12px; padding: 12px 14px; width: 100%; }
.mute { color: var(--dim); } .small { font-size: 13px; }
.label { font-size: 13px; font-weight: 700; color: var(--dim); letter-spacing: .02em; }

/* 사이트 공통 머리말 */
.brand { display: flex; align-items: center; gap: 12px; }
.brand > div { min-width: 0; flex: 1; }
.logo { font-family: var(--f-serif); font-size: 26px; line-height: 1; padding-right: 12px; border-right: 1px solid var(--line); white-space: nowrap; color: var(--text); text-decoration: none; }
.logo span { color: var(--accent); }
.eyebrow { font-family: var(--f-num); font-size: 11px; letter-spacing: .14em; color: var(--dim); text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.brand h1 { font-family: var(--f-serif); font-weight: 400; font-size: 30px; line-height: 1.05; margin: 2px 0 0; }
.ptag { flex: none; font-size: 12px; font-weight: 700; color: #1a1405; background: var(--devil); border-radius: 999px; padding: 3px 10px; }
.backlink { justify-self: start; color: var(--text); text-decoration: none; font-weight: 700; font-size: 14px; background: var(--card); border: 1px solid var(--line); border-radius: 999px; padding: 7px 14px; }
/* 메뉴·로비 */
.hero { text-align: center; padding-top: 24px; display: grid; gap: 6px; }
.hero h1 { margin: 0; font-family: var(--f-serif); font-weight: 400; font-size: 44px; }
.hero h1 b { font-family: var(--f-num); color: var(--gold); font-size: 54px; margin-left: 4px; }
.box { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 18px; display: grid; gap: 12px; }
.row { display: flex; gap: 8px; align-items: center; }
.row > * { flex: 1; }
.seg { display: flex; gap: 6px; flex-wrap: wrap; }
.seg button { flex: 1; padding: 9px 8px; font-size: 14px; border-radius: 10px; background: var(--card-2); }
.seg button.on { background: var(--text); border-color: var(--text); color: var(--bg); }
.err { color: var(--danger); font-size: 13px; min-height: 18px; }
.members { display: grid; gap: 6px; }
.mem { display: flex; align-items: center; gap: 10px; padding: 11px 14px; border-radius: 12px; background: var(--card-2); border: 1px solid var(--line); }
.mem .tag { margin-left: auto; font-size: 12px; color: var(--gold); }
.mem.ai { color: var(--dim); border-style: dashed; }
.back-home { justify-self: start; color: var(--dim); text-decoration: none; font-size: 14px; font-weight: 700; }

/* 게임 머리 */
.top { display: flex; align-items: flex-end; gap: 10px; }
.top .code { display: grid; }
.top .code b { font-family: var(--f-num); font-weight: 600; font-size: 32px; line-height: 1; letter-spacing: .14em; color: var(--accent); }
.top .grow { flex: 1; }
.rhead { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
.rhead h2 { margin: 0; font-family: var(--f-serif); font-weight: 400; font-size: 36px; letter-spacing: .02em; line-height: 1; white-space: nowrap; }
.rhead h2 small { font-size: 24px; color: var(--dim); }
.rhead .mypen { color: var(--dim); font-size: 17px; white-space: nowrap; }
.rhead .mypen b { font-family: var(--f-num); color: var(--text); font-size: 22px; }

/* 플레이어 카드 (옆으로 넘김) */
.pcards { display: flex; gap: 10px; overflow-x: auto; scroll-snap-type: x proximity; margin-right: calc(-1 * max(16px, env(safe-area-inset-right, 0px))); padding: 2px max(16px, env(safe-area-inset-right, 0px)) 6px 0; scrollbar-width: none; }
.pcards::-webkit-scrollbar { display: none; }
.pc { flex: none; width: 132px; scroll-snap-align: start; background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 14px 12px 12px; display: grid; gap: 4px; position: relative; transition: border-color .2s, transform .2s; }
.pc.cur { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent), 0 8px 24px rgba(243,182,65,.22); }
.pc.me .nm span { color: var(--accent); }
.pc .crown { position: absolute; top: 10px; right: 10px; width: 22px; height: 22px; }
.pc .nm { display: flex; align-items: center; gap: 7px; min-width: 0; margin-top: 16px; font-size: 15px; font-weight: 500; }
.pc .nm span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dot { flex: none; width: 13px; height: 13px; border-radius: 50%; }
.pc .pen { font-family: var(--f-num); font-weight: 700; font-size: 32px; line-height: 1.1; color: var(--text); }
.pc .pen em { font-style: normal; font-size: 16px; color: var(--danger); margin-left: 4px; }
.pc .st { font-size: 13px; color: var(--dim); display: flex; align-items: center; gap: 6px; min-height: 22px; }
.pc .st.ok { color: var(--ok); }
.pc .st.now { color: var(--accent); font-weight: 700; }
.pc .ai { font-size: 10.5px; color: var(--faint); border: 1px solid var(--line-2); border-radius: 6px; padding: 0 5px; margin-left: auto; flex: none; }
.minisub { display: inline-flex; align-items: center; gap: 5px; font-family: var(--f-num); font-weight: 700; font-size: 15px; color: var(--text); }

/* 받침대 3개 */
.stands { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; align-items: end; padding-top: 6px; }
.stand { display: grid; justify-items: center; position: relative; }
.stand .sum { font-family: var(--f-num); font-weight: 700; font-size: 20px; color: var(--text); margin-bottom: 4px; }
.stand .sum small { font-size: 13px; color: var(--faint); }
.rocks { display: flex; flex-wrap: wrap-reverse; justify-content: center; align-content: flex-start; gap: 3px; width: 92%; min-height: 64px; padding-bottom: 2px; }
.rock { width: 30px; height: 26px; border-radius: 9px 11px 8px 10px; background: radial-gradient(circle at 35% 30%, #fffdf6, #d9d3c2 70%); color: var(--stone-ink); display: grid; place-items: center; font-family: var(--f-num); font-weight: 700; font-size: 15px; box-shadow: inset 0 -3px 0 rgba(0,0,0,.18), 0 2px 4px rgba(0,0,0,.4); border-bottom: 3px solid var(--o, #888); }
.rock.new { animation: drop .45s cubic-bezier(.3,1.5,.5,1); }
@keyframes drop { 0% { transform: translateY(-26px); opacity: 0; } 100% { transform: none; opacity: 1; } }
.stand svg.atlas { width: 100%; height: auto; display: block; }
.stand.bust svg.atlas, .stand.bust .rocks { animation: shake .5s; }
@keyframes shake { 20% { transform: translateX(-6px) rotate(-2deg); } 40% { transform: translateX(6px) rotate(2deg); } 60% { transform: translateX(-4px); } 80% { transform: translateX(3px); } }
.stand .meter { width: 70%; height: 4px; border-radius: 3px; background: rgba(0,0,0,.3); overflow: hidden; margin-top: 2px; }
.stand .meter i { display: block; height: 100%; border-radius: 3px; background: var(--c); }
.stand .safe { font-size: 11.5px; color: var(--faint); margin-top: 4px; text-align: center; }
@media (prefers-reduced-motion: reduce) { .rock.new, .stand.bust svg.atlas, .stand.bust .rocks { animation: none; } }

/* 안내 + 시간 막대 */
.phase { display: grid; gap: 10px; text-align: center; }
.phase p { margin: 0; font-size: 17px; font-weight: 700; color: var(--text); }
.bar { height: 6px; border-radius: 4px; background: rgba(0,0,0,.3); overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--accent); border-radius: 4px; transition: width .25s linear; }
.bar.low i { background: var(--danger); }

/* 내 패: 카드·칩·제출 */
.panel { background: var(--card); border: 1px solid var(--line); border-radius: 20px; padding: 18px 16px; display: grid; gap: 16px; }
.cards { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 7px; }
.card { aspect-ratio: 5 / 7; padding: 3px; border-radius: 10px; background: var(--stone); border: 0; color: var(--stone-ink); position: relative; transition: transform .15s; }
.card span { display: grid; place-items: center; height: 100%; border: 1.5px solid #2c4a42; border-radius: 7px; font-family: var(--f-serif); font-weight: 400; font-size: clamp(20px, 6.4vw, 30px); }
.card.sel { transform: translateY(-6px); box-shadow: 0 0 0 3px var(--gold), 0 10px 18px rgba(0,0,0,.45); }
.card:disabled { opacity: .16; }
.chips { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 7px; justify-items: center; }
.chip { width: 100%; max-width: 46px; aspect-ratio: 1; border-radius: 50%; padding: 0; border: 3px solid rgba(0,0,0,.35); background: var(--c); transition: transform .15s; }
.chip.W { background: radial-gradient(circle, var(--G) 0 22%, var(--R) 23% 46%, var(--B) 47%); }
.chip.sel { transform: scale(1.1); border-color: var(--gold); box-shadow: 0 0 0 2px var(--gold); }
.chip:disabled { opacity: .14; }
.cdot { display: inline-block; width: 14px; height: 14px; border-radius: 50%; background: var(--c); vertical-align: -2px; }
.cdot.W { background: radial-gradient(circle, var(--G) 0 22%, var(--R) 23% 46%, var(--B) 47%); }
.preview { text-align: center; font-size: 14px; color: var(--dim); min-height: 20px; margin-top: -4px; }
.preview .bad { color: var(--danger); font-weight: 700; } .preview .good { color: var(--ok); font-weight: 700; }
.opts { display: grid; gap: 8px; }
.opt { text-align: left; display: flex; align-items: center; gap: 10px; padding: 14px; border-radius: 14px; background: var(--card-2); }
.opt .tx { flex: 1; display: grid; gap: 2px; }
.opt .tx small { font-weight: 500; color: var(--dim); font-size: 13px; }
.opt .tx small.bad { color: var(--danger); } .opt .tx small.good { color: var(--ok); }
.done-sub { display: flex; align-items: center; justify-content: center; gap: 12px; font-size: 16px; }
.order { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; }
.order > span { display: inline-flex; align-items: center; gap: 5px; padding: 5px 10px; border-radius: 999px; background: var(--card-2); border: 1px solid var(--line); font-size: 13px; }
.order > span.now { border-color: var(--accent); color: var(--accent); }
.order > span.done { opacity: .45; }

/* 벌점 순위 */
.rank-h { margin: 6px 0 0; font-family: var(--f-serif); font-weight: 400; font-size: 24px; }
.ranks { display: grid; gap: 8px; }
.rk { display: flex; align-items: center; gap: 12px; padding: 13px 16px; border-radius: 16px; background: var(--card); border: 1px solid var(--line); }
.rk.me { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.rk .n { font-family: var(--f-num); font-weight: 700; font-size: 20px; color: var(--gold); width: 22px; text-align: center; }
.rk .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 17px; }
.rk .p { font-family: var(--f-num); font-weight: 700; font-size: 22px; color: var(--text); }
html:not(.is-owner) details.log { display: none !important; }
details.log { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 10px 14px; }
details.log summary { cursor: pointer; font-weight: 700; color: var(--dim); font-size: 14px; }
.logs { display: grid; gap: 3px; font-size: 13px; color: var(--dim); margin-top: 8px; max-height: 220px; overflow-y: auto; }
.logs .bust { color: #f5a08f; } .logs .info { color: var(--dim); }

/* 결과·규칙 창 */
.ov { position: fixed; inset: 0; z-index: 30; background: rgba(4,14,12,.8); display: flex; align-items: center; justify-content: center; padding: 20px; }
.modal { border-top: 4px solid var(--accent); width: 100%; max-width: 420px; max-height: 88vh; overflow-y: auto; background: var(--card); border: 1px solid var(--line-2); border-radius: 20px; padding: 22px 20px; display: grid; gap: 12px; }
.modal h3 { margin: 0; font-family: var(--f-serif); font-weight: 400; font-size: 26px; text-align: center; }
.modal ol { margin: 0; padding-left: 20px; display: grid; gap: 6px; font-size: 14px; color: var(--text); }
.modal ol b { color: var(--gold); }
.toasts { position: fixed; left: 50%; top: max(14px, env(safe-area-inset-top, 0px)); transform: translateX(-50%); z-index: 40; display: grid; gap: 6px; width: min(92vw, 420px); pointer-events: none; }
.toasts div { background: #3a1712; border: 1px solid #8a3a2c; color: #ffe2da; border-radius: 12px; padding: 10px 14px; font-weight: 700; font-size: 14px; text-align: center; box-shadow: 0 8px 20px rgba(0,0,0,.4); animation: tin .3s; }
@keyframes tin { from { transform: translateY(-10px); opacity: 0; } }
</style>
</head>
<body>
<div class="wrap">
  <header class="brand"><a class="logo" href="/" aria-label="1x1 MATCH 홈으로">1<span>x</span>1</a><div><div class="eyebrow">1x1 MATCH · 데블스플랜 · 5~7인</div><h1>무거운 13</h1></div></header>
  <div id="app" style="display:grid;gap:18px"></div>
</div>
<div class="toasts" id="toasts"></div>
<div class="ov" id="ov" hidden><div class="modal" id="modal"></div></div>
<script>
(() => {
'use strict';
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const COLORS = ['R', 'G', 'B'], CN = { R: '빨강', G: '초록', B: '파랑', W: '레인보우' }, LIMIT = 13, SET_ROUNDS = 7;
const CV = { R: 'var(--R)', G: 'var(--G)', B: 'var(--B)' };
const sumOf = a => a.reduce((s, x) => s + x.v, 0);
const store = { get(k) { try { return sessionStorage.getItem(k); } catch (e) { return null; } }, set(k, v) { try { v == null ? sessionStorage.removeItem(k) : sessionStorage.setItem(k, v); } catch (e) {} } };

let ME = null, NAME = '', room = null, V = null, es = null, screen = 'menu', menuErr = '', soloCount = 5, soloLv = 0;
let ui = { card: null, chip: null, editing: false }, prev = null, localDeadline = 0, lastLog = 0;

const lsGet = k => { try { return localStorage.getItem(k) || ''; } catch (e) { return ''; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} };
NAME = lsGet('h13_name');
const meP = fetch('/api/auth/me', { cache: 'no-store' }).then(r => r.json()).then(d => { ME = d.user || null; if (screen === 'menu') render(); }).catch(() => {});
async function post(path, body) {
  body = Object.assign({ name: NAME }, body || {});
  const r = await fetch('/api/h13/rooms' + path, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body || {}) });
  const d = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(d.error || '요청이 실패했어요.');
  return d;
}
const act = body => post(`/${room.code}/act`, Object.assign({ token: room.token }, body)).catch(e => toast(e.message));

function enter(code, token) {
  room = { code, token }; store.set('h13_room', JSON.stringify(room));
  try { history.replaceState(null, '', '#' + code); } catch (e) {}
  connect();
}
function connect() {
  if (es) es.close();
  es = new EventSource(`/api/h13/rooms/${room.code}/events?token=${encodeURIComponent(room.token)}`);
  es.onmessage = e => {
    const d = JSON.parse(e.data);
    if (d.left) { leaveLocal(); return; }
    onView(d);
  };
  es.onerror = () => { if (es && es.readyState === 2) { setTimeout(() => room && connect(), 2000); } };
}
function leaveLocal(msg) { if (es) es.close(); es = null; room = null; V = null; prev = null; store.set('h13_room', null); screen = 'menu'; menuErr = msg || ''; try { history.replaceState(null, '', location.pathname); } catch (e) {} render(); }
async function leave() { const r = room; leaveLocal(); if (r) post(`/${r.code}/leave`, { token: r.token }).catch(() => {}); }

function onView(v) {
  const g = v.game, pg = V && V.game;
  if (g) {
    localDeadline = g.deadlineIn != null ? Date.now() + g.deadlineIn : 0;
    if (!pg || pg.round !== g.round || g.phase !== 'submit') { if (!pg || pg.round !== g.round) { ui.card = null; ui.chip = null; ui.editing = false; } }
    // 새 폭발 알림
    for (const e of g.log) if (e.seq > lastLog && pg) { if (e.type === 'bust') { const p = g.players.find(x => x.id === e.pid); toast(`💥 ${p ? p.name : ''} · ${CN[e.color]} 받침대 무너짐! 벌점 +${e.pen}`); } }
    lastLog = g.log.length ? g.log[g.log.length - 1].seq : lastLog;
  }
  prev = V; V = v; screen = g ? 'game' : 'lobby';
  render();
}

/* ---------- 그림: 받침대를 든 사람 ---------- */
function atlas(c) {
  const col = CV[c];
  return `<svg class="atlas" viewBox="0 0 120 118" aria-hidden="true">
    <ellipse cx="60" cy="112" rx="34" ry="4" fill="rgba(0,0,0,.35)"/>
    <path d="M10 14 v8 a50 9 0 0 0 100 0 v-8" fill="${col}" style="filter:brightness(.62)"/>
    <ellipse cx="60" cy="14" rx="50" ry="9" fill="${col}" stroke="rgba(255,255,255,.25)" stroke-width="1.5"/>
    <g fill="#7f968d" stroke="#7f968d" stroke-linecap="round" stroke-linejoin="round">
      <path d="M38 30 L32 52 L45 62" stroke-width="9" fill="none"/>
      <path d="M82 30 L88 52 L75 62" stroke-width="9" fill="none"/>
      <circle cx="60" cy="48" r="8.5" stroke="none"/>
      <path d="M46 60 Q60 54 74 60 L69 82 L51 82 Z" stroke-width="2"/>
      <path d="M52 82 L34 92 L30 108 M68 82 L86 94 L92 108" stroke-width="9" fill="none"/>
      <path d="M50 80 L70 80 L72 90 L48 90 Z" fill="#5f756c" stroke="#5f756c" stroke-width="2"/>
    </g>
  </svg>`;
}
const crown = '<svg class="crown" viewBox="0 0 24 24" fill="none" stroke="#f3b641" stroke-width="1.8" stroke-linejoin="round"><path d="M3 8l4.5 4L12 5l4.5 7L21 8l-2 11H5z"/><path d="M5 19h14"/></svg>';

  const rows = g.ranking.map(r => { const p = g.players.find(x => x.id === r.id); const out = n >= 7 && r.rank >= n - 1;
    return `<div class="rk ${r.id === V.me ? 'me' : ''}"><span class="n">${r.rank}</span><i class="dot" style="background:${p ? p.hue : '#888'}"></i><span class="nm">${esc(r.name)}${out ? ' <span style="color:var(--danger);font-size:13px">탈락</span>' : r.rank === 1 ? ' <span style="color:var(--gold);font-size:13px">우승</span>' : ''}</span><span class="p">${r.penalty}</span></div>`; }).join('');
  const again = V.solo ? '<button class="btn-main" id="again">다시 하기</button>' : V.host ? '<button class="btn-main" id="again">같은 멤버로 대기실로</button>' : '<p class="mute small" style="text-align:center;margin:0">방장이 다음 게임을 열 수 있어요</p>';
  openModal(`<h3>최종 결과</h3><div class="ranks">${rows}</div><p class="mute small" style="margin:0;text-align:center">벌점이 같으면 더 최근에 벌점을 받은 쪽이 아래 순위예요</p>${again}<button id="closeM">판 보기</button>`);
  const a = $('again'); if (a) a.onclick = async () => { if (V.solo && !(await FreePlay.ok('heavy13', FreePlay.newId()))) return; closeModal(); await act({ type: 'lobby' }); if (V.solo) act({ type: 'start' }); };
  $('closeM').onclick = closeModal;
}
function showRules() {
  openModal(`<h3>무거운 13 규칙</h3><ol>
    <li>각자 바위 카드 <b>0~6</b> 7장과 색깔 칩 빨강·초록·파랑 2개씩, <b>레인보우</b> 1개를 받아요.</li>
    <li>매 라운드 카드 1장과 칩 1개를 몰래 동시에 내요. 칩 색 = 올릴 받침대, 카드 숫자 = 바위 무게.</li>
    <li>올리는 순서: <b>레인보우</b> 낸 사람 → <b>큰 숫자</b> 순. 같으면 선 플레이어부터 시계방향.</li>
    <li>레인보우는 올릴 때 받침대 색을 직접 골라요.</li>
    <li>내 차례에 라운드당 한 번 <b>패스</b>할 수 있어요. 패스한 사람은 나머지가 다 올린 뒤 <b>패스한 순서의 역순</b>으로 올려요.</li>
    <li>내 바위를 올려 받침대 합이 <b>13 이상</b>이 되면 무너져요. 원래 있던 바위 <b>개수만큼 벌점</b>을 받고, 내 바위 1개만 남아요.</li>
    <li>마지막으로 벌점을 받은 사람이 다음 라운드 선 플레이어예요.</li>
    <li>7라운드 뒤 카드·칩을 다시 받고(받침대는 그대로) 14라운드까지 해요.</li>
    <li>벌점이 가장 적은 사람이 1위. 같으면 더 최근에 벌점을 받은 사람이 아래예요. (방송: 7인 기준 6·7위 탈락)</li>
  </ol><p class="mute small" style="margin:0">시간 안에 못 고르거나 접속이 끊기면 AI가 대신 골라요. 같은 방에 다시 들어오면 이어서 할 수 있어요.</p><button class="btn-main" id="closeM">닫기</button>`);
  $('closeM').onclick = closeModal;
}
function openModal(html) { $('modal').innerHTML = html; $('ov').hidden = false; }
function closeModal() { $('ov').hidden = true; }
$('ov').onclick = e => { if (e.target.id === 'ov') closeModal(); };
function toast(msg, kind) {
  const d = document.createElement('div'); d.textContent = msg;
  if (kind === 'ok') { d.style.background = '#0b2420'; d.style.borderColor = '#5c7a4c'; d.style.color = '#f1eee4'; }
  $('toasts').appendChild(d); setTimeout(() => d.remove(), 2800);
}

// 새로고침해도 들어가 있던 방으로 돌아감
try {
  const sv = JSON.parse(store.get('h13_room') || 'null');
  if (sv && sv.code && sv.token) post(`/${sv.code}/join`, { token: sv.token }).then(d => enter(d.code, d.token)).catch(() => { store.set('h13_room', null); render(); });
} catch (e) {}
render();
// 초대 링크(#코드)로 들어오면 바로 참가
meP.then(() => { const c = (location.hash || '').slice(1).toUpperCase(); if (!ME && !NAME) { if (/^[A-Z0-9]{4}$/.test(c)) { menuErr = '이름을 입력하고 참가를 누르세요'; render(); } return; } if (/^[A-Z0-9]{4}$/.test(c) && !store.get('h13_room')) post(`/${c}/join`, {}).then(d => enter(d.code, d.token)).catch(e => { menuErr = e.message; render(); }); });
})();
</script>
