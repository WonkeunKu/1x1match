<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>연봉 블라인드 경매 온라인</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Mono:wght@500;600&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* Layout: one phone column (max 520px) on the scoreboard green. Top bar → event line → this card's auction → 4×4 board → four players. Single dark look on purpose, same palette as the offline board. */
:root {
  --board: #10302a; --board-2: #163d35; --slot: #0b2420;
  --chalk: #f1eee4; --chalk-dim: #a7bcb2; --line: rgba(241, 238, 228, 0.14);
  --amber: #f3b641; --red: #e8604a;
  --p0: #f3b641; --p1: #6fc4ea; --p2: #f28f74; --p3: #a9d774;
  --f-display: "Black Han Sans", "Noto Sans KR", "Apple SD Gothic Neo", sans-serif;
  --f-body: "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { background: #071815; }
body {
  margin: 0; min-height: 100vh; color: var(--chalk); font-family: var(--f-body); font-size: 15px; line-height: 1.45;
  background-color: var(--board);
  background-image: repeating-linear-gradient(90deg, transparent 0 79px, rgba(0,0,0,0.1) 79px 80px), repeating-linear-gradient(0deg, transparent 0 79px, rgba(0,0,0,0.08) 79px 80px);
  padding-left: max(14px, env(safe-area-inset-left, 0px)); padding-right: max(14px, env(safe-area-inset-right, 0px));
}
.app { max-width: 520px; margin: 0 auto; padding-block: 14px 40px; display: grid; gap: 12px; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }
.btn { border: 1px solid var(--line); background: var(--board-2); padding: 10px 14px; border-radius: 8px; font-weight: 700; font-size: 15px; }
.btn.primary { background: var(--chalk); color: var(--board); border-color: var(--chalk); }
.btn.amber { background: var(--amber); color: #1a1405; border-color: var(--amber); }
.btn.warn { background: var(--red); color: #fff; border-color: var(--red); }
.btn:disabled { opacity: 0.4; cursor: not-allowed; }
.btn.block { width: 100%; }
input[type=text], input[type=number], select {
  width: 100%; background: var(--slot); border: 1px solid var(--line); color: var(--chalk); border-radius: 8px; padding: 11px 12px; font: inherit; font-size: 16px;
}
.eyebrow { font-family: var(--f-mono); font-size: 11px; letter-spacing: 0.14em; color: var(--chalk-dim); text-transform: uppercase; }
h1 { font-family: var(--f-display); font-weight: 400; font-size: 34px; line-height: 1.05; margin: 2px 0 0; }
.panel { background: var(--slot); border: 1px solid var(--line); border-radius: 10px; padding: 14px; display: grid; gap: 10px; }
.panel h2 { margin: 0; font-family: var(--f-display); font-weight: 400; font-size: 22px; }
.muted { color: var(--chalk-dim); font-size: 13px; margin: 0; }
.err { color: var(--red); font-size: 13px; min-height: 18px; margin: 0; }
.row { display: flex; gap: 8px; align-items: center; }
.row > * { min-width: 0; }

/* logo + desktop */
.logo { font-family: var(--f-display); font-size: 26px; line-height: 1; color: var(--chalk); text-decoration: none; padding-right: 12px; border-right: 1px solid var(--line); white-space: nowrap; flex: none; }
.logo span { color: var(--amber); }
.brand { display: flex; align-items: center; gap: 12px; }
.brand > div { min-width: 0; }
.cols, .entryGrid { display: grid; gap: 12px; align-items: start; }
.colL, .colR { display: grid; gap: 12px; min-width: 0; }
@media (min-width: 900px) {
  .app { max-width: 1180px; padding-block: 22px 48px; }
  .app.narrow { max-width: 860px; }
  .cols { grid-template-columns: minmax(380px, 440px) minmax(0, 1fr); }
  .colL { position: sticky; top: 16px; }
  .entryGrid { grid-template-columns: 1fr 1fr; }
  .players { grid-template-columns: 1fr 1fr; }
  .bigcode { font-size: 56px; }
}

/* top bar */
.bar { display: flex; align-items: center; gap: 10px; }
.bar .title { font-family: var(--f-display); font-size: 20px; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.code { font-family: var(--f-mono); font-weight: 600; background: var(--slot); border: 1px solid var(--line); border-radius: 6px; padding: 4px 8px; font-size: 13px; }
.mycubes { font-family: var(--f-mono); font-size: 13px; }
.mycubes b { font-size: 22px; color: var(--pc); }
.event { font-size: 14px; background: rgba(243,182,65,0.12); border: 1px solid rgba(243,182,65,0.35); border-radius: 8px; padding: 8px 10px; }
.conn { font-size: 12px; color: var(--red); }

/* lobby */
.bigcode { font-family: var(--f-mono); font-size: 44px; font-weight: 600; letter-spacing: 0.12em; color: var(--amber); text-align: center; }
.seats { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.seat { border: 1px solid var(--line); border-left: 4px solid var(--pc); border-radius: 8px; padding: 10px; background: var(--board-2); font-weight: 700; }
.seat.empty { border-left-color: var(--line); color: var(--chalk-dim); font-weight: 400; }

/* current card */
.cardbox { display: grid; grid-template-columns: 112px minmax(0, 1fr); gap: 12px; align-items: start; }
.photo { width: 112px; height: 140px; border-radius: 8px; overflow: hidden; background: var(--board-2); }
.photo img { width: 100%; height: 100%; object-fit: cover; object-position: center top; display: block; }
.cinfo { display: grid; gap: 4px; }
.cinfo .nm { font-family: var(--f-display); font-size: 30px; line-height: 1.05; }
.cinfo .tm { font-size: 13px; color: var(--chalk-dim); }
.facts { display: flex; gap: 6px; flex-wrap: wrap; }
.facts span { font-size: 13px; background: var(--board-2); border-radius: 4px; padding: 2px 8px; font-variant-numeric: tabular-nums; }
.hint { font-size: 14px; border-left: 3px solid var(--chalk-dim); padding-left: 8px; color: var(--chalk-dim); word-break: keep-all; }
.chance { background: var(--amber); color: #1a1405; border-radius: 10px; padding: 14px; display: grid; gap: 6px; }
.chance.rel { background: var(--red); color: #fff; }
.chance .nm { font-family: var(--f-display); font-size: 30px; line-height: 1.05; }
.chance p { margin: 0; font-size: 14px; word-break: keep-all; }
.highbid { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; border-top: 1px dashed var(--line); padding-top: 10px; }
.highbid .v { font-family: var(--f-mono); font-size: 34px; font-weight: 600; color: var(--amber); font-variant-numeric: tabular-nums; }
.order { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
.order div { border: 1px solid var(--line); border-top: 3px solid var(--pc); border-radius: 6px; padding: 6px; font-size: 12px; text-align: center; background: var(--board-2); overflow: hidden; }
.order div b { display: block; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.order div.out { opacity: 0.4; }
.order div.turn { box-shadow: 0 0 0 2px var(--pc); }
.order div.high { background: color-mix(in srgb, var(--pc) 25%, var(--board-2)); }
.myturn { display: grid; gap: 8px; background: rgba(243,182,65,0.1); border: 1px solid var(--amber); border-radius: 10px; padding: 12px; }
.myturn h3 { margin: 0; font-size: 15px; color: var(--amber); }
.stepper { display: grid; grid-template-columns: 52px 1fr 52px; gap: 6px; }
.stepper button { background: var(--board-2); border: 1px solid var(--line); border-radius: 8px; font-size: 22px; }
.stepper input { text-align: center; font-family: var(--f-mono); font-size: 24px; font-weight: 600; }
.quick { display: flex; gap: 6px; flex-wrap: wrap; }
.quick button { border: 1px solid var(--line); background: var(--board-2); border-radius: 6px; padding: 5px 10px; font-family: var(--f-mono); font-size: 13px; }
.price { text-align: center; font-family: var(--f-mono); font-size: 64px; font-weight: 600; line-height: 1; color: var(--red); }
.giveup { font-size: 22px; padding: 18px; }

/* board */
.board { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
.tile { aspect-ratio: 1 / 0.82; border-radius: 8px; border: 1px solid var(--line); background: var(--slot); box-shadow: inset 0 0 0 3px rgba(0,0,0,0.25); display: grid; place-items: center; align-content: center; gap: 2px; padding: 4px; text-align: center; min-width: 0; }
.tile .n { font-family: var(--f-display); font-size: 26px; line-height: 1; }
.tile .t { font-size: 12px; font-weight: 700; line-height: 1.15; word-break: keep-all; overflow: hidden; max-width: 100%; }
.tile .o { font-size: 10px; font-weight: 700; color: #10201b; background: var(--pc); border-radius: 999px; padding: 0 6px; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tile .s { font-size: 10px; color: var(--chalk-dim); }
.tile.pickable { border-color: var(--amber); cursor: pointer; }
.tile.pickable .n { color: var(--amber); }
.tile.live { border-color: var(--amber); box-shadow: inset 0 0 0 3px rgba(243,182,65,0.3); }
.tile.done { background: var(--board-2); box-shadow: none; }
.tile.gone { opacity: 0.5; }
.tile.gone .t { text-decoration: line-through; }

/* players */
.players { display: grid; gap: 8px; }
.pl { background: var(--slot); border: 1px solid var(--line); border-left: 4px solid var(--pc); border-radius: 8px; padding: 9px 10px; display: grid; gap: 6px; }
.pl.me { box-shadow: 0 0 0 1px var(--pc); }
.pl .hd { display: flex; align-items: center; gap: 8px; }
.pl .hd b { font-size: 15px; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pl .hd .cb { font-family: var(--f-mono); font-size: 13px; color: var(--chalk-dim); }
.pl .hd .cb strong { color: var(--pc); font-size: 18px; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: #4a5a55; flex: none; }
.dot.on { background: #7bd88f; }
.chips { display: flex; gap: 5px; flex-wrap: wrap; }
.chip { font-size: 13px; padding: 2px 8px; border-radius: 4px; background: var(--board-2); border: 1px solid var(--line); white-space: nowrap; }
.chip.ch { border-color: rgba(243,182,65,0.6); color: var(--amber); }
.chip.rel { border-color: rgba(232,96,74,0.7); color: var(--red); }
button.chip.peek { cursor: pointer; user-select: none; -webkit-user-select: none; touch-action: none; border-color: var(--pc); }
button.chip.peek.showing { background: var(--pc); color: #10201b; font-weight: 700; }

/* 노트북·데스크톱: 경기 화면을 한 화면에 (왼쪽 경매 카드 · 가운데 판 · 오른쪽 참가자) */
@media (min-width: 900px) and (min-height: 520px) {
  .app.playing { max-width: 1480px; height: 100vh; display: flex; flex-direction: column; padding-block: 14px; gap: 10px; }
  .app.playing .cols { flex: 1; min-height: 0; grid-template-columns: minmax(340px, 400px) minmax(0, 1fr); align-items: stretch; }
  .app.playing .colL { position: static; min-height: 0; overflow-y: auto; align-content: start; }
  .app.playing .colR { min-height: 0; grid-template-columns: minmax(0, 1fr) minmax(240px, 300px); align-items: stretch; }
  .app.playing .board { height: 100%; grid-template-rows: repeat(4, minmax(0, 1fr)); }
  .app.playing .tile { aspect-ratio: auto; min-height: 0; }
  .app.playing .tile .n { font-size: clamp(20px, 4vh, 34px); }
  .app.playing .pcol { min-height: 0; overflow-y: auto; display: grid; gap: 8px; align-content: start; }
  .app.playing .players { grid-template-columns: 1fr; }
  .app.playing .photo { width: 96px; height: 120px; }
  .app.playing .cardbox { grid-template-columns: 96px minmax(0, 1fr); }
}
.pcol { display: grid; gap: 8px; }

/* 내 선수 연봉 */
.chip.mine { border-color: var(--pc); }
.chip.mine b { color: var(--amber); font-family: var(--f-mono); margin-left: 2px; }

/* AI */
.aichip { font-family: var(--f-body); font-size: 11px; font-weight: 700; background: var(--p1); color: #0a1a22; border-radius: 999px; padding: 1px 7px; margin-left: 6px; vertical-align: 2px; }
.seg.three { grid-template-columns: repeat(3, 1fr); }

/* public rooms */
.seg { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; background: var(--board-2); border-radius: 8px; padding: 4px; }
.seg button { border: 0; background: transparent; border-radius: 6px; padding: 9px 4px; font-weight: 700; font-size: 14px; color: var(--chalk-dim); }
.seg button[aria-checked="true"] { background: var(--chalk); color: var(--board); }
.rlist { display: grid; gap: 6px; }
.ritem { display: grid; grid-template-columns: auto 1fr auto auto; gap: 8px; align-items: center; background: var(--board-2); border-radius: 8px; padding: 8px 10px; }
.ritem b { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 14px; }
.ritem .btn { padding: 6px 10px; font-size: 13px; }
.timer { position: relative; display: flex; align-items: baseline; gap: 4px; background: var(--slot); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px 9px; font-size: 13px; overflow: hidden; }
.timer span:first-child { flex: 1; color: var(--chalk-dim); }
.timer b { font-family: var(--f-mono); font-size: 20px; color: var(--amber); }
.timer i { position: absolute; left: 0; bottom: 0; height: 3px; width: var(--w); background: var(--amber); transition: width 0.25s linear; }

/* results */
.res { display: grid; gap: 8px; }
.res .pl .hd strong.sum { font-family: var(--f-mono); font-size: 22px; color: var(--pc); }
.rank { font-family: var(--f-mono); color: var(--amber); }
.x2 { font-size: 10px; background: var(--amber); color: #1a1405; border-radius: 3px; padding: 0 4px; margin-left: 4px; }
</style>
</head>
<body>
<div class="app" id="app"></div>

<script>
const PC = ['var(--p0)', 'var(--p1)', 'var(--p2)', 'var(--p3)'];
const esc = s => String(s ?? '').replace(/[&<>"]/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[ch]));
const fmt = v => { const r = Math.round(v * 100) / 100; return (Number.isInteger(r) ? String(r) : r.toFixed(2).replace(/0$/, '')) + '억'; };
const store = {
  get(k) { try { return localStorage.getItem(k); } catch { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch {} }
};
const app = document.getElementById('app');
const AI_MODE = location.pathname.startsWith('/auction/ai');
const LEVEL_KO = { low: '하', mid: '중', high: '상' };
const params = new URLSearchParams(location.search);
let code = (params.get('room') || '').toUpperCase();
let token = code ? store.get('auction-online:' + code) : null;
let deadlineAt = null;
let V = null, es = null, connected = false, bidDraft = null, errMsg = '', trDraft = {};

async function post(path, body) {
  const r = await fetch(path, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body || {}) });
  const j = await r.json().catch(() => ({ error: '서버 응답을 읽지 못했어요.' }));
  if (!r.ok) throw new Error(j.error || '요청이 실패했어요.');
  return j;
}
async function act(body) {
  try { errMsg = ''; await post(`/api/auction/rooms/${code}/act`, Object.assign({ token }, body)); }
  catch (e) { errMsg = e.message; render(); }
}

/* ---------- entry ---------- */
function renderAiEntry(msg) {
  app.classList.add('narrow');
  const lastName = store.get('auction-online:name') || '';
  let level = store.get('auction-ai:level') || 'mid';
  app.innerHTML = `<header class="brand"><a class="logo" href="/" aria-label="1x1 MATCH 홈으로">1<span>x</span>1</a><div><div class="eyebrow">1x1 MATCH · 혼자 · AI 대전</div><h1>연봉 블라인드 경매</h1></div></header>
    <p class="muted">나와 AI 3명이 겨뤄요. AI도 선수 연봉을 '대충' 알고 있어서, 난이도가 높을수록 실제 연봉에 가깝게 알고 큐브를 아껴 써요. 사람과 하려면 <a href="/auction/online/" style="color:var(--amber)">온라인 4인</a>으로 가세요.</p>
    <div class="entryGrid"><div class="colL"><div class="panel">
      <label class="muted" for="nm">내 이름</label>
      <input type="text" id="nm" maxlength="10" value="${esc(lastName)}" placeholder="예: Player1" autocomplete="nickname">
    </div></div><div class="colR"><div class="panel"><h2>AI 난이도</h2>
      <div class="seg three" role="radiogroup" aria-label="AI 난이도">
        ${['low', 'mid', 'high'].map(l => `<button type="button" role="radio" data-level="${l}" aria-checked="${l === level}">${LEVEL_KO[l]}</button>`).join('')}
      </div>
      <p class="muted" id="lvNote"></p>
      <button class="btn amber block" id="aiStart" type="button">AI와 시작하기</button></div></div></div>
    <p class="err" id="err">${esc(msg || '')}</p>`;
  const notes = { low: '하: AI가 연봉을 ±50%까지 잘못 알고, 기분 따라 오버하거나 일찍 포기해요.', mid: '중: AI가 연봉을 ±25% 오차로 알고, 대체로 가치만큼만 입찰해요.', high: '상: AI가 연봉을 ±10% 오차로 알고, 남은 큐브와 카드를 계산해서 아껴 써요.' };
  const setLv = l => { level = l; app.querySelectorAll('[data-level]').forEach(b => b.setAttribute('aria-checked', String(b.dataset.level === l))); document.getElementById('lvNote').textContent = notes[l]; };
  app.querySelectorAll('[data-level]').forEach(b => b.onclick = () => setLv(b.dataset.level));
  setLv(level);
  document.getElementById('aiStart').onclick = async () => {
    try {
      const n = document.getElementById('nm').value.trim();
      if (!n) throw new Error('이름을 입력하세요.');
      store.set('auction-online:name', n); store.set('auction-ai:level', level);
      const r = await post('/api/auction/ai', { name: n, level });
      enter(r.code, r.token);
    } catch (e) { document.getElementById('err').textContent = e.message; }
  };
}
function renderEntry(msg) {
  if (AI_MODE) return renderAiEntry(msg);
  const lastName = store.get('auction-online:name') || '';
  app.innerHTML = `
    <header class="brand"><a class="logo" href="/" aria-label="1x1 MATCH 홈으로">1<span>x</span>1</a><div><div class="eyebrow">1x1 MATCH · 온라인 4인</div><h1>연봉 블라인드 경매</h1></div></header>
    <p class="muted">4명이 각자 폰으로 들어와서 플레이해요. 한 명이 방을 만들고, 나머지 3명은 방 코드나 링크로 들어오면 돼요. 혼자 연습하려면 <a href="/auction/ai/" style="color:var(--amber)">AI 대전</a>으로 가세요.</p>
    <div class="entryGrid"><div class="colL">
    <div class="panel">
      <label class="muted" for="nm">내 이름</label>
      <input type="text" id="nm" maxlength="10" value="${esc(lastName)}" placeholder="예: Player1" autocomplete="nickname">
    </div>
    <div class="panel">
      <h2>${code ? `방 ${esc(code)} 들어가기` : '방 들어가기'}</h2>
      ${code ? '' : '<input type="text" id="cd" maxlength="4" placeholder="방 코드 4자리" autocapitalize="characters" style="text-transform:uppercase;font-family:var(--f-mono)">'}
      <button class="btn primary block" id="joinBtn" type="button">들어가기</button>
    </div>
    </div><div class="colR">
    ${code ? '' : `<div class="panel"><h2>모르는 사람과 하기</h2>
      <button class="btn amber block" id="quickBtn" type="button">빠른 입장</button>
      <p class="muted">사람을 기다리는 공개 방에 바로 들어가요. 없으면 새 공개 방을 만들어요.</p>
      <div id="roomList" class="rlist"><p class="muted">공개 방을 불러오는 중…</p></div></div>
    <div class="panel"><h2>새 방 만들기</h2>
      <div class="seg" role="radiogroup" aria-label="방 공개 설정">
        <button type="button" role="radio" data-vis="private" aria-checked="true">비공개 · 코드로만</button>
        <button type="button" role="radio" data-vis="public" aria-checked="false">공개 · 누구나</button>
      </div>
      <p class="muted" id="visNote">친구에게 방 코드나 링크를 보내서 같이 해요.</p>
      <button class="btn primary block" id="createBtn" type="button">방 만들기</button></div>`}
    </div></div>
    <p class="err" id="err">${esc(msg || '')}</p>
    <p class="muted"><a href="/" style="color:var(--chalk-dim)">← 1x1 MATCH 첫 화면</a></p>`;
  app.classList.add('narrow');
  const nameOf = () => { const n = document.getElementById('nm').value.trim(); if (!n) throw new Error('이름을 입력하세요.'); store.set('auction-online:name', n); return n; };

        : '친구에게 방 코드나 링크를 보내서 같이 해요.';
    });
    cb.onclick = async () => {
      try { const r = await post('/api/auction/rooms', { name: nameOf(), public: vis === 'public' }); enter(r.code, r.token); }
      catch (e) { showErr(e); }
    };
    document.getElementById('quickBtn').onclick = async () => {
      try { const r = await post('/api/auction/quick', { name: nameOf() }); enter(r.code, r.token); }
      catch (e) { showErr(e); }
    };
    const list = document.getElementById('roomList');
    list.onclick = async e => {
      const b = e.target.closest('[data-join]'); if (!b) return;
      try { const r = await post(`/api/auction/rooms/${b.dataset.join}/join`, { name: nameOf() }); enter(r.code, r.token); }
      catch (err) { showErr(err); }
    };
    const load = async () => {
      if (!document.body.contains(list)) { clearInterval(listTimer); return; }
      try {
        const r = await (await fetch('/api/auction/rooms')).json();
        list.innerHTML = r.rooms.length
          ? r.rooms.map(x => `<div class="ritem"><span class="code">${esc(x.code)}</span><b>${esc(x.host)}님의 방</b><span class="muted">${x.count}/4</span><button class="btn" type="button" data-join="${esc(x.code)}">들어가기</button></div>`).join('')
          : '<p class="muted">지금 기다리는 공개 방이 없어요. 빠른 입장을 누르면 새 공개 방이 만들어져요.</p>';
      } catch { list.innerHTML = '<p class="muted">방 목록을 불러오지 못했어요.</p>'; }
    };

  }
}
let listTimer = null;
function enter(c, t) {
  clearInterval(listTimer);
  code = c; token = t;
  store.set('auction-online:' + c, t);
  history.replaceState(null, '', '?room=' + c);
  connect();
}

/* ---------- live connection ---------- */
function connect() {
  if (es) es.close();
  es = new EventSource(`/api/auction/rooms/${code}/events?token=${encodeURIComponent(token)}`);
  es.onmessage = e => {
    const d = JSON.parse(e.data);
    if (d.kicked) { es.close(); es = null; V = null; history.replaceState(null, '', location.pathname); code = ''; renderEntry('연결이 오래 끊겨서 방에서 빠졌어요. 다시 들어가 주세요.'); return; }
    V = d; connected = true;
    deadlineAt = V.turnLeftMs === null ? null : Date.now() + V.turnLeftMs;
    render();
  };
  es.onerror = async () => {
    connected = false; if (V) render();
    // 방이 사라졌는지(서버 재시작 등) 확인
    try { await post(`/api/auction/rooms/${code}/join`, { token }); }
    catch (err) { es.close(); es = null; V = null; renderEntry(err.message); }
  };
}

/* ---------- game screens ---------- */
const nameOf = k => esc(V.players[k].name);

}

      const theirOpts = V.players.map((p, k) => k === me ? '' : p.cards.map(id => `<option value="${esc(id)}">${esc(p.name)} · ${esc(playerCard(id).name)}</option>`).join('')).join('');
      lower = `<div class="myturn"><h3>트레이드할 선수를 고르세요</h3>
        <label class="muted" for="trMine">내보낼 내 선수</label><select id="trMine">${mineOpts}</select>
        <label class="muted" for="trTheirs">데려올 상대 선수</label><select id="trTheirs">${theirOpts}</select>
        <button class="btn amber block" type="button" data-a="trade">교환하기</button></div>`;

function boardHtml() {

  return `<div class="board">${V.tiles.map((t, i) => {
    if (!t) return `<button type="button" class="tile ${canPick ? 'pickable' : ''}" ${canPick ? `data-a="open" data-i="${i}"` : 'disabled'} aria-label="${i + 1}번 칸"><span class="n">${i + 1}</span></button>`;
    const live = ['open', 'release', 'trading'].includes(t.status);
    const gone = t.status === 'pass' || t.status === 'released';
    let meta = '';
    if (live) meta = `<span class="s">진행 중</span>`;
    else if (t.status === 'won' || (t.status === 'applied' && t.p !== undefined)) meta = `<span class="o" style="--pc:${PC[t.p]}">${nameOf(t.p)}</span>`;
    else if (t.status === 'pass') meta = `<span class="s">유찰</span>`;
    else if (t.status === 'released') meta = `<span class="s">방출</span>`;

}

function renderLobby() {

    : `<div class="seat empty">빈 자리</div>`).join('');

    <div class="entryGrid"><div class="colL"><div class="panel"><p class="muted" style="text-align:center">${V.public ? '공개 방 · 누구나 들어올 수 있어요' : '비공개 방 · 코드를 아는 사람만'} · 방 코드</p><div class="bigcode">${esc(V.code)}</div>
      <div class="row"><input type="text" id="lnk" readonly value="${esc(link)}"><button class="btn" type="button" id="copyBtn">링크 복사</button></div>

function renderResult() {

function render() {
  if (!V) return;
  const focusId = document.activeElement && document.activeElement.id;
  app.classList.remove('narrow');
  if (V.phase === 'lobby') renderLobby();
  else if (V.phase === 'result') renderResult();
  else app.innerHTML = topBar() + `<div class="cols"><div class="colL">${curPanel()}</div><div class="colR">${boardHtml()}${playersHtml()}</div></div>`;
  app.classList.toggle('narrow', V.phase !== 'play');
  app.classList.toggle('playing', V.phase === 'play');
  if (focusId === 'bidIn' && document.getElementById('bidIn')) document.getElementById('bidIn').focus();
  ['trMine', 'trTheirs'].forEach(id => { const el = document.getElementById(id); if (el && trDraft[id] && [...el.options].some(o => o.value === trDraft[id])) el.value = trDraft[id]; });
}

/* ---------- input ---------- */
app.addEventListener('click', e => {
  const b = e.target.closest('[data-a]'); if (!b || !V) return;
  const a = b.dataset.a;
  const inp = document.getElementById('bidIn');
  if (a === 'inc' || a === 'dec') { bidDraft = Math.min(+inp.max, Math.max(+inp.min, (parseInt(inp.value, 10) || 0) + (a === 'inc' ? 1 : -1))); inp.value = bidDraft; return; }
  if (a === 'set') { bidDraft = +b.dataset.v; inp.value = bidDraft; return; }
  if (a === 'bid') { const v = parseInt(inp.value, 10); bidDraft = null; act({ type: 'bid', amount: v }); return; }
  if (a === 'fold') { bidDraft = null; act({ type: 'fold' }); return; }
  if (a === 'open') { act({ type: 'open', tile: +b.dataset.i }); return; }
  if (a === 'giveup') { act({ type: 'giveup' }); return; }
  if (a === 'trade') { act({ type: 'trade', mine: document.getElementById('trMine').value, theirs: document.getElementById('trTheirs').value }); return; }
  if (a === 'start') { act({ type: 'start' }); return; }
  if (a === 'leave') {
    post(`/api/auction/rooms/${code}/leave`, { token }).catch(() => {});
    if (es) es.close(); es = null; V = null;
    history.replaceState(null, '', location.pathname); code = ''; token = null;
    renderEntry(); return;
  }
  if (a === 'restart') { post(`/api/auction/rooms/${code}/restart`, { token }).catch(err => { errMsg = err.message; render(); }); return; }
});
app.addEventListener('input', e => { if (e.target.id === 'bidIn') bidDraft = parseInt(e.target.value, 10) || null; });
app.addEventListener('change', e => { if (e.target.id === 'trMine' || e.target.id === 'trTheirs') trDraft[e.target.id] = e.target.value; });
// 내 선수 연봉: 꾹 누르는 동안만 보여줌
const showPeek = (b, on) => {
  const id = b.dataset.peek;
  b.classList.toggle('showing', on);
  b.textContent = on ? `${b.dataset.label} ${fmt(V.salaries[id])}` : `${b.dataset.label} · 꾹`;
};
app.addEventListener('pointerdown', e => { const b = e.target.closest('[data-peek]'); if (b) { e.preventDefault(); showPeek(b, true); } });
['pointerup', 'pointercancel', 'pointerleave'].forEach(ev => app.addEventListener(ev, e => { const b = e.target.closest('[data-peek]'); if (b) showPeek(b, false); }, true));
app.addEventListener('contextmenu', e => { if (e.target.closest('[data-peek]')) e.preventDefault(); });

setInterval(() => {
  if (!deadlineAt) return;
  const left = Math.max(0, deadlineAt - Date.now());
  app.querySelectorAll('[data-countdown]').forEach(el => { el.textContent = Math.ceil(left / 1000); });
  const bar = app.querySelector('.timer i'); if (bar && V) bar.style.setProperty('--w', (left / V.turnMs * 100) + '%');
}, 250);
