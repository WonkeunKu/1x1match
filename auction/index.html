<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>연봉 블라인드 경매 연습판</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Mono:wght@500;600&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* Layout: a fixed 960×1060 scoreboard stage, scaled to fit the window, so it fills the left half of a broadcast split screen. Board on top, four bidders in a 2×2 strip below. Single dark look on purpose. */
:root {
  --board: #10302a;
  --board-2: #163d35;
  --slot: #0b2420;
  --chalk: #f1eee4;
  --chalk-dim: #a7bcb2;
  --line: rgba(241, 238, 228, 0.14);
  --amber: #f3b641;
  --red: #e8604a;
  --p1: #f3b641;
  --p2: #6fc4ea;
  --p3: #f28f74;
  --p4: #a9d774;
  --stage-w: 960px;
  --stage-h: 1060px;
  --f-display: "Black Han Sans", "Noto Sans KR", "Apple SD Gothic Neo", sans-serif;
  --f-body: "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  color-scheme: dark;
}
html, body { height: 100%; background: #07181500; }
html { background: #071815; }
body { background: #071815; color: var(--chalk); font-family: var(--f-body); font-size: 15px; line-height: 1.5; overflow: hidden; position: relative; }
* { box-sizing: border-box; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }

.stage {
  position: absolute; left: 0; top: 0; width: var(--stage-w); height: var(--stage-h);
  transform-origin: 0 0; overflow: hidden;
  background-color: var(--board);
  background-image:
    repeating-linear-gradient(90deg, transparent 0 119px, rgba(0,0,0,0.12) 119px 120px),
    repeating-linear-gradient(0deg, transparent 0 119px, rgba(0,0,0,0.10) 119px 120px);
  display: flex; flex-direction: column;
}

/* Header */
.top { display: flex; align-items: center; gap: 18px; padding: 16px 20px; border-bottom: 1px solid var(--line); background: rgba(0,0,0,0.18); flex: none; }
.eyebrow { font-family: var(--f-mono); font-size: 11px; letter-spacing: 0.14em; color: var(--chalk-dim); text-transform: uppercase; }
h1 { font-family: var(--f-display); font-weight: 400; font-size: 34px; line-height: 1.05; margin: 2px 0 0; letter-spacing: 0.01em; white-space: nowrap; }
.pot { display: flex; flex-direction: column; padding: 6px 14px; border-left: 3px solid var(--amber); background: var(--slot); }
.pot .label { font-size: 12px; color: var(--chalk-dim); }
.pot strong { font-family: var(--f-mono); font-size: 24px; font-weight: 600; color: var(--amber); font-variant-numeric: tabular-nums; line-height: 1.2; }
.pot .sub { font-size: 11px; color: var(--chalk-dim); }
.controls { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-left: auto; }
.controls .primary { grid-column: 1 / -1; }
.btn {
  border: 1px solid var(--line); background: var(--board-2); padding: 6px 12px; border-radius: 6px; font-size: 13px; font-weight: 500;
  transition: background 0.15s, border-color 0.15s; white-space: nowrap;
}
.btn:hover { border-color: var(--chalk-dim); }
.btn.primary { background: var(--chalk); color: var(--board); border-color: var(--chalk); font-weight: 700; }
.btn.warn { background: var(--red); border-color: var(--red); color: #fff; }
.btn:disabled { opacity: 0.4; cursor: not-allowed; }

/* Main */
.layout { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 14px; padding: 14px 20px 18px; }
.boardHead { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex: none; }
.boardHead strong { font-family: var(--f-display); font-weight: 400; font-size: 20px; }
.legend { display: flex; gap: 14px; font-size: 12px; color: var(--chalk-dim); }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
.board { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); grid-template-rows: repeat(4, 128px); gap: 10px; flex: none; }
.tile {
  position: relative; border-radius: 8px; border: 1px solid var(--line);
  background: var(--slot); box-shadow: inset 0 0 0 4px rgba(0,0,0,0.25);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; padding: 8px; text-align: center;
  transition: transform 0.15s, border-color 0.15s; min-width: 0;
}
.tile:hover { transform: translateY(-2px); border-color: var(--chalk-dim); }
.practice { font-family: var(--f-body); font-weight: 700; font-size: 15px; vertical-align: middle; background: var(--amber); color: #1a1405; padding: 3px 10px; border-radius: 999px; margin-left: 6px; letter-spacing: 0; }
.pcardBig .photo .ini { font-family: var(--f-display); font-size: 150px; line-height: 1; color: var(--amber); }
.pcardBig .photo .pteam { font-family: var(--f-mono); font-size: 14px; letter-spacing: 0.14em; color: var(--chalk-dim); }
.tile .num { font-family: var(--f-display); font-size: 60px; line-height: 1; color: var(--chalk); }
.tile .tname { font-weight: 700; font-size: 22px; line-height: 1.2; word-break: keep-all; }
.tile .tmeta { font-size: 12px; color: var(--chalk-dim); font-family: var(--f-mono); }
.tile .corner { position: absolute; top: 6px; left: 9px; font-family: var(--f-mono); font-size: 12px; color: var(--chalk-dim); }
.tile .owner { font-size: 13px; font-weight: 700; padding: 2px 10px; border-radius: 999px; color: #10201b; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tile.pending { border-color: var(--amber); box-shadow: inset 0 0 0 4px rgba(243,182,65,0.18); }
.tile.pending .num { color: var(--amber); }
.tile.done { background: var(--board-2); box-shadow: none; }
.tile.chance.done { background: rgba(243,182,65,0.12); border-color: rgba(243,182,65,0.5); }
.tile.release.done { background: rgba(232,96,74,0.14); border-color: rgba(232,96,74,0.55); }
.tile.gone { opacity: 0.55; }
.tile.gone .tname { text-decoration: line-through; }

/* Players */
.players { flex: 1; min-height: 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); grid-template-rows: repeat(2, minmax(0, 1fr)); gap: 10px; }
.pcard { background: var(--slot); border: 1px solid var(--line); border-radius: 8px; padding: 10px 14px; display: flex; flex-direction: column; gap: 8px; border-top: 3px solid var(--pc); min-width: 0; min-height: 0; overflow: hidden; }
.pcard .row { display: flex; align-items: center; gap: 10px; }
.pcard input.pname {
  flex: 1; min-width: 0; background: transparent; border: 0; border-bottom: 1px dashed var(--line); color: var(--chalk);
  font-family: var(--f-display); font-size: 22px; padding: 2px 0;
}
.cubes { text-align: right; display: flex; align-items: baseline; gap: 6px; }
.cubes strong { font-family: var(--f-mono); font-size: 28px; font-weight: 600; font-variant-numeric: tabular-nums; color: var(--pc); line-height: 1; }
.cubes span { font-size: 11px; color: var(--chalk-dim); }
.owned { display: flex; flex-wrap: wrap; gap: 6px; align-content: flex-start; min-height: 0; overflow: hidden; }
.chip { font-size: 14px; font-weight: 500; padding: 3px 9px; border-radius: 4px; background: var(--board-2); border: 1px solid var(--line); white-space: nowrap; }
.chip.ch { border-color: rgba(243,182,65,0.6); color: var(--amber); }
.chip.act { background: var(--amber); color: #1a1405; border-color: var(--amber); font-weight: 700; cursor: pointer; }
.chip.used { opacity: 0.6; }
.chip.rel { border-color: rgba(232,96,74,0.7); color: var(--red); }
.empty { font-size: 13px; color: var(--chalk-dim); }

/* Modal (inside the stage) */
.overlay {
  position: absolute; inset: 0; z-index: 50; background: rgba(4, 14, 12, 0.84);
  display: flex; align-items: center; justify-content: center; padding: 20px; overflow-y: auto;
}
.dialog { width: 100%; max-width: 560px; margin: auto; display: grid; gap: 12px; }
.dialog:has(.pcardBig), .dialog:has(.relGrid) { max-width: 920px; }
.card {
  background: var(--chalk); color: #14231f; border-radius: 12px; padding: 22px 24px 20px; position: relative; overflow: hidden;
  animation: flip 0.5s cubic-bezier(.2,.8,.2,1);
}
@keyframes flip { from { transform: perspective(900px) rotateY(80deg); opacity: 0.3; } to { transform: none; opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .card { animation: none; } .tile { transition: none; } }
.card.pcardBig { padding: 0; display: grid; grid-template-columns: 430px minmax(0, 1fr); }
.pcardBig .photo { background: var(--slot); min-width: 0; }
.pcardBig .photo img { display: block; width: 100%; height: 540px; max-width: 100%; object-fit: cover; object-position: center top; }
.pcardBig .info { padding: 26px 28px 22px; min-width: 0; display: flex; flex-direction: column; }
.pcardBig .info .salary { margin-top: auto; }
.pcardBig .info .hint { margin-bottom: 16px; }
.cardTop { display: flex; align-items: center; gap: 8px; font-family: var(--f-mono); font-size: 13px; color: #4b5f58; }
.cardTop .team { font-family: var(--f-body); font-weight: 700; font-size: 15px; color: #14231f; background: #dfe8e2; padding: 2px 12px; border-radius: 999px; }
.badge { font-family: var(--f-body); font-size: 13px; font-weight: 700; background: #14231f; color: var(--chalk); padding: 2px 10px; border-radius: 999px; }
.card h2 { font-family: var(--f-display); font-weight: 400; font-size: 72px; line-height: 1; margin: 18px 0 16px; letter-spacing: 0.01em; }
.facts { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 0; }
.facts div { background: #e6ece7; border-radius: 8px; padding: 10px 14px; }
.facts dt { font-size: 12px; color: #4b5f58; }
.facts dd { margin: 0; font-weight: 700; font-size: 22px; font-variant-numeric: tabular-nums; }
.hint { margin: 18px 0 0; font-size: 20px; line-height: 1.45; color: #2b3d37; border-left: 3px solid #14231f; padding-left: 14px; word-break: keep-all; }
.salary { margin-top: 16px; display: flex; align-items: center; gap: 12px; border-top: 1px dashed #b9c7bf; padding-top: 14px; flex-wrap: wrap; }
.salary span { font-size: 13px; color: #4b5f58; }
.salary strong { font-family: var(--f-mono); font-size: 30px; font-weight: 600; font-variant-numeric: tabular-nums; }
.salary .lock { margin-left: auto; font-size: 13px; color: #4b5f58; }
.salary .hold { user-select: none; -webkit-user-select: none; touch-action: none; }
.salary button { margin-left: auto; border: 1px solid #14231f; background: transparent; color: #14231f; border-radius: 6px; padding: 6px 12px; font-size: 13px; font-weight: 500; }
.card.chanceCard { background: var(--amber); }
.card.chanceCard.rel { background: var(--red); color: #fff; }
.card.chanceCard.rel .cardTop, .card.chanceCard.rel .hint { color: #fff; border-color: #fff; }
.card .effect { font-size: 20px; font-weight: 500; margin: 0; line-height: 1.5; word-break: keep-all; }
.panel { background: var(--board-2); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; display: grid; gap: 10px; }
.panel h3 { margin: 0; font-size: 14px; font-weight: 700; color: var(--chalk-dim); }
.bidRow { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.bidRow label { font-size: 14px; }
.stepper { display: flex; align-items: stretch; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
.stepper button { background: var(--slot); border: 0; width: 40px; font-size: 18px; }
.stepper input { width: 64px; text-align: center; background: var(--board); border: 0; color: var(--chalk); font-family: var(--f-mono); font-size: 20px; font-weight: 600; }
.quick { display: flex; gap: 6px; flex-wrap: wrap; }
.quick button { border: 1px solid var(--line); background: var(--slot); border-radius: 4px; padding: 4px 8px; font-family: var(--f-mono); font-size: 13px; }
.winners { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.winners button { border: 2px solid var(--pc); background: var(--slot); border-radius: 8px; padding: 8px 10px; text-align: left; display: grid; gap: 2px; min-width: 0; }
.winners button b { font-size: 15px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.winners button span { font-size: 12px; color: var(--chalk-dim); font-family: var(--f-mono); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.winners button:disabled { opacity: 0.35; cursor: not-allowed; }
.relGrid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.relBox { border: 2px solid var(--pc); background: var(--slot); border-radius: 8px; padding: 10px; display: grid; gap: 8px; min-width: 0; }
.relBox .stepper { justify-self: start; }
.relBox .stepper button { width: 32px; }
.relBox .stepper input { width: 52px; }
.relBox .stepper input:disabled { opacity: 0.35; }
.relName { display: grid; min-width: 0; }
.relName b { font-size: 15px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.relName span { font-size: 12px; color: var(--chalk-dim); font-family: var(--f-mono); }
.relPick { border: 1px solid var(--line); background: var(--board-2); border-radius: 6px; padding: 5px 8px; font-size: 13px; font-weight: 700; }
.relBox.picked { background: var(--pc); color: #10201b; }
.relBox.picked .relName span { color: #10201b; }
.relBox.picked .relPick { background: #10201b; color: var(--chalk); border-color: #10201b; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
.err { color: var(--red); font-size: 13px; min-height: 18px; margin: 0; }
.status { font-size: 16px; margin: 0; }
.status b { color: var(--amber); }

/* Results */
.result { flex: 1; min-height: 0; padding: 18px 20px; display: flex; flex-direction: column; gap: 16px; }
.resultHead { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; }
.resultHead h2 { font-family: var(--f-display); font-weight: 400; font-size: 40px; margin: 0; }
.resultGrid { flex: 1; min-height: 0; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
.rcol { background: var(--slot); border: 1px solid var(--line); border-top: 4px solid var(--pc); border-radius: 8px; padding: 14px 12px; display: flex; flex-direction: column; gap: 10px; min-width: 0; min-height: 0; overflow: hidden; }
.rcol.first { box-shadow: 0 0 0 2px var(--amber); }
.rname { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.rname b { font-family: var(--f-display); font-weight: 400; font-size: 22px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.rank { font-family: var(--f-mono); font-size: 15px; color: var(--amber); flex: none; }
.rtotal { font-family: var(--f-mono); font-size: 34px; font-weight: 600; font-variant-numeric: tabular-nums; color: var(--pc); line-height: 1; }
.rtotal small { font-size: 13px; color: var(--chalk-dim); margin-left: 4px; font-weight: 500; }
.rlist { display: grid; gap: 6px; }
.rcard { display: flex; justify-content: space-between; align-items: center; gap: 6px; padding: 8px 10px; border-radius: 6px; background: var(--board-2); border: 1px solid var(--line); text-align: left; width: 100%; font-size: 15px; }
.rcard .v { font-family: var(--f-mono); font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; }
.rcard .orig { font-size: 11px; color: var(--chalk-dim); font-weight: 500; }
.rcard .x2 { font-size: 11px; color: #1a1405; background: var(--amber); border-radius: 3px; padding: 1px 5px; margin-left: 6px; }
.rnote { font-size: 12px; color: var(--chalk-dim); margin-top: auto; }
.trade select { width: 100%; background: var(--slot); color: var(--chalk); border: 1px solid var(--line); border-radius: 6px; padding: 10px; font: inherit; }
.trade label { display: grid; gap: 6px; font-size: 13px; color: var(--chalk-dim); }
</style>

</head>
<body>
<div class="stage" id="stage">
  <header class="top">
    <div>
      <div class="eyebrow">Rallypick · KBO 연봉 맞히기</div>
      <h1>연봉 블라인드 경매 <span class="practice">연습용</span></h1>
    </div>
    <div class="pot" aria-label="선수 연봉 총합">
      <span class="label">선수 13명 연평균 연봉 총합</span>
      <strong id="potTotal">-</strong>
      <span class="sub" id="potSub">-</span>
    </div>
    <div class="controls">
      <button class="btn" id="undoBtn" type="button">되돌리기</button>
      <button class="btn" id="newBtn" type="button">새 게임</button>
      <button class="btn primary" id="resultBtn" type="button">결과 발표</button>
    </div>
  </header>

  <main class="layout" id="mainView">
    <div class="boardHead">
      <strong id="remain">남은 카드 16장</strong>
      <div class="legend">
        <span><i style="background:var(--slot);border:1px solid var(--line)"></i>미공개</span>
        <span><i style="background:var(--amber)"></i>찬스 카드</span>
        <span><i style="background:var(--red)"></i>방출</span>
      </div>
    </div>
    <div class="board" id="board"></div>
    <section class="players" id="players" aria-label="참가자"></section>
  </main>

  <section class="result" id="resultView" hidden></section>

  <div class="overlay" id="modal" hidden>
    <div class="dialog" id="dialog" role="dialog" aria-modal="true" aria-label="카드"></div>
  </div>
</div>

<script>
const START_CUBES = 20;
const MIN_BID = 2;
const CHANCE_AFTER = { trade: 8, double: 2, release: 2 }; // 선수 카드가 이만큼 공개된 뒤부터 해당 찬스 카드가 나올 수 있음
const CARDS = [
  { id: 'kmh', type: 'player', name: '강민호', team: '삼성', seasons: '2018–2021', term: '4년', hint: '롯데 프랜차이즈 포수의 이적', aav: 80 / 4 },
  { id: 'ysm', type: 'player', name: '윤석민', team: 'KIA', seasons: '2015–2018', term: '4년', hint: '미국 도전 1년 만에 친정 복귀', aav: 90 / 4 },
  { id: 'sah', type: 'player', name: '손아섭', team: 'NC', seasons: '2022–2025', term: '4년', hint: '부산을 떠나 창원으로', aav: 64 / 4 },
  { id: 'chw', type: 'player', name: '최형우', team: 'KIA', seasons: '2017–2020', term: '4년', hint: 'KBO 첫 100억 FA', aav: 100 / 4 },
  { id: 'kjh', type: 'player', name: '김재환', team: '두산', seasons: '2022–2025', term: '4년', hint: '잠실 홈런왕의 FA 잔류', aav: 115 / 4 },
  { id: 'kkh', type: 'player', name: '김광현', team: 'SSG', seasons: '2022–2025', term: '4년', hint: 'MLB에서 돌아온 에이스의 비FA 계약', aav: 151 / 4 },
  { id: 'pbh', type: 'player', name: '박병호', team: 'KT', seasons: '2022–2024', term: '3년', hint: '홈런왕의 30대 후반 이적', aav: 30 / 3 },
  { id: 'phm', type: 'player', name: '박해민', team: 'LG', seasons: '2022–2025', term: '4년', hint: '삼성 주장의 FA 이적', aav: 60 / 4 },
  { id: 'ces', type: 'player', name: '채은성', team: '한화', seasons: '2023–2028', term: '6년', hint: 'LG를 떠나 대전으로', aav: 90 / 6 },
  { id: 'psw', type: 'player', name: '박세웅', team: '롯데', seasons: '2023–2027', term: '5년', hint: '토종 선발의 비FA 다년계약', aav: 90 / 5 },
  { id: 'ojh', type: 'player', name: '오지환', team: 'LG', seasons: '2024–2029', term: '6년', hint: '우승 주장의 FA 잔류', aav: 124 / 6 },
  { id: 'rhj', type: 'player', name: '류현진', team: '한화', seasons: '2024–2031', term: '8년', hint: '12년 만의 친정 복귀', aav: 170 / 8 },
  { id: 'kdy', type: 'player', name: '김도영', team: 'KIA', seasons: '2025', term: '1년', hint: '4년 차 최고 연봉 신기록', aav: 5 },
  { id: 'trade', type: 'chance', kind: 'trade', name: '트레이드권', effect: '낙찰 즉시, 보유한 내 선수 1명과 상대 선수 1명을 교환합니다. 보유 선수가 없으면 그대로 소멸합니다.', auction: true },
  { id: 'release', type: 'chance', kind: 'release', name: '방출', effect: '가장 먼저 경매를 포기한 사람이 낙찰받아, 가장 최근에 영입한 자기 선수를 방출합니다. 포기한 사람은 큐브를 내지 않고, 나머지 3명은 포기 시점에 입찰한 큐브를 모두 냅니다.', auction: true },
  { id: 'double', type: 'chance', kind: 'double', name: '연봉 2배', effect: '결과 합산 때 보유한 선수 중 최저 연봉 선수의 연봉이 2배가 됩니다.', auction: true }
];
const BY_ID = Object.fromEntries(CARDS.map(c => [c.id, c]));
const PLAYERS_TOTAL = CARDS.filter(c => c.type === 'player').reduce((s, c) => s + c.aav, 0);
const PC = ['var(--p1)', 'var(--p2)', 'var(--p3)', 'var(--p4)'];
const KEY = 'salary-auction-practice-v1';
const DEFAULT_NAMES = ['09SK입문', '냠냠냠', '빅쵸이', '파파크라켄'];

const fmt = v => {
  const r = Math.round(v * 100) / 100;
  return (Number.isInteger(r) ? String(r) : r.toFixed(2).replace(/0$/, '')) + '억';
};
const esc = s => String(s).replace(/[&<>"]/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[ch]));
function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

function fresh(names) {
  return {
    deck: Array(16).fill(null),
    opened: {},
    players: [0, 1, 2, 3].map(i => ({ name: (names && names[i]) || DEFAULT_NAMES[i], cubes: START_CUBES, cards: [], chances: [] })),
    last: null,
    tradeUsed: false,
    phase: 'play',
    revealed: {}
  };
}

let S;
let history = [];
let modalIdx = null;
let relPick = null;

function load() {
  try { const raw = localStorage.getItem(KEY); if (raw) { const s = JSON.parse(raw); if (s && s.deck && s.deck.length === 16) return s; } } catch (e) {}
  return fresh();
}
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }
function commit() { history.push(JSON.stringify(S)); if (history.length > 80) history.shift(); }
function undo() {
  if (!history.length) return;
  S = JSON.parse(history.pop());
  closeModal();
  save(); renderAll();
}

function allDone() { return S.deck.every((_, i) => S.opened[i] && S.opened[i].status !== 'open' && S.opened[i].status !== 'trading'); }

function ownerOf(id) {
  for (let i = 0; i < 4; i++) {
    if (S.players[i].cards.includes(id) || S.players[i].chances.includes(id)) return i;
  }
  return -1;
}

/* ---------- Board ---------- */
function renderBoard() {
  const b = document.getElementById('board');
  let html = '';
  let remain = 0;
  S.deck.forEach((id, i) => {
    const o = S.opened[i];
    const c = BY_ID[id];
    const n = i + 1;
    if (!o) {
      remain++;
      html += `<button class="tile" type="button" data-i="${i}" aria-label="${n}번 카드 열기"><span class="num">${n}</span></button>`;
      return;
    }
    if (o.status === 'open' || o.status === 'trading') {
      html += `<button class="tile pending" type="button" data-i="${i}" aria-label="${n}번 경매 중"><span class="num">${n}</span><span class="tmeta">${o.status === 'trading' ? '트레이드 중' : '경매 중'}</span></button>`;
      return;
    }
    const cls = ['tile', 'done'];
    if (c.type === 'chance') cls.push(c.kind === 'release' ? 'release' : 'chance');
    if (o.status === 'pass' || o.status === 'released') cls.push('gone');
    let meta = '';
    if (o.status === 'won') {
      const p = S.players[o.p];
      meta = `<span class="owner" style="background:${PC[o.p]}">${esc(p.name)}</span><span class="tmeta">큐브 ${o.bid}</span>`;
    } else if (o.status === 'pass') {
      meta = `<span class="tmeta">유찰</span>`;
    } else if (o.status === 'released') {
      meta = `<span class="tmeta">방출됨</span>`;
    } else if (o.status === 'applied') {
      meta = `<span class="tmeta">${esc(o.note || '적용 완료')}</span>`;
    }
    html += `<button class="${cls.join(' ')}" type="button" data-i="${i}"><span class="corner">${n}</span><span class="tname">${esc(c.name)}</span>${meta}</button>`;
  });
  b.innerHTML = html;
  document.getElementById('remain').textContent = remain ? `남은 카드 ${remain}장` : (allDone() ? '16장 모두 공개 · 결과 발표를 누르세요' : '경매 중인 카드를 마무리하세요');
}

/* ---------- Players ---------- */
function renderPlayers() {
  const el = document.getElementById('players');
  el.innerHTML = S.players.map((p, i) => {
    const cards = p.cards.map(id => `<span class="chip">${esc(BY_ID[id].name)}</span>`).join('');
    const pend = (p.pendingRelease !== undefined && p.pendingRelease !== null) ? '<span class="chip ch rel">방출 카드 보유 · 다음 영입 선수 방출</span>' : '';
    const ch = pend + p.chances.map(id => {
      if (id === 'trade' && S.phase === 'play') {
        return S.tradeUsed ? '<span class="chip ch used">트레이드권 사용함</span>'
          : `<button type="button" class="chip ch act" data-trade="${i}">트레이드권 사용</button>`;
      }
      return `<span class="chip ch">${esc(BY_ID[id].name)}</span>`;
    }).join('');
    return `<div class="pcard" style="--pc:${PC[i]}">
      <div class="row">
        <input class="pname" id="pname-${i}" data-p="${i}" value="${esc(p.name)}" aria-label="${i + 1}번 참가자 이름" maxlength="12">
        <div class="cubes"><strong>${p.cubes}</strong><span>남은 큐브</span></div>
      </div>
      <div class="owned">${cards || ch ? cards + ch : '<span class="empty">아직 영입한 선수가 없습니다</span>'}</div>
    </div>`;
  }).join('');
}

function renderHeader() {
  document.getElementById('potTotal').textContent = fmt(PLAYERS_TOTAL);
  document.getElementById('potSub').textContent = `평균 ${fmt(PLAYERS_TOTAL / 13)} · 다년계약은 총액 ÷ 연수`;
  document.getElementById('undoBtn').disabled = !history.length;
  const rb = document.getElementById('resultBtn');
  rb.textContent = S.phase === 'result' ? '보드로 돌아가기' : '결과 발표';
  rb.disabled = S.phase === 'play' && !allDone();
  rb.title = rb.disabled ? '16장을 모두 연 뒤에 결과를 발표할 수 있어요' : '';
}

function renderAll() {
  renderHeader();
  const inResult = S.phase === 'result';
  document.getElementById('mainView').hidden = inResult;
  document.getElementById('resultView').hidden = !inResult;
  if (inResult) renderResult(); else { renderBoard(); renderPlayers(); }
}

/* ---------- Modal ---------- */
function drawCard() {
  const used = new Set(S.deck.filter(Boolean));
  let pool = CARDS.map(c => c.id).filter(id => !used.has(id));
  const playersOut = S.deck.filter(id => id && BY_ID[id].type === 'player').length;
  const allowed = pool.filter(id => BY_ID[id].type === 'player' || playersOut >= (CHANCE_AFTER[BY_ID[id].kind] || 0));
  if (allowed.length) pool = allowed;
  return pool[Math.floor(Math.random() * pool.length)];
}

function openTile(i) {
  if (S.opened[i] && S.opened[i].status === 'trading') { showTrade(S.opened[i].p, i); return; }
  if (!S.opened[i]) {
    commit();
    if (!S.deck[i]) S.deck[i] = drawCard();
    S.opened[i] = { status: 'open' };
    save(); renderAll();
  }
  showModal(i);
}

function cardHtml(i) {
  const c = BY_ID[S.deck[i]];
  const o = S.opened[i] || {};
  const no = String(i + 1).padStart(2, '0');
  if (c.type === 'chance') {
    return `<div class="card chanceCard ${c.kind === 'release' ? 'rel' : ''}">
      <div class="cardTop"><span>No. ${no}</span><span class="badge">찬스 카드</span></div>
      <h2>${esc(c.name)}</h2>
      <p class="effect">${esc(c.effect)}</p>
    </div>`;
  }
  return `<div class="card pcardBig">
    <div class="photo"><img src="photos/${c.id}.jpg" alt="${esc(c.name)} 선수 사진"></div>
    <div class="info">
    <div class="cardTop"><span>No. ${no}</span><span class="team">${esc(c.team)}</span>${c.foreign ? '<span class="badge">외국인</span>' : ''}</div>
    <h2>${esc(c.name)}</h2>
    <dl class="facts">
      <div><dt>계약 시즌</dt><dd>${esc(c.seasons)}</dd></div>
      <div><dt>계약 기간</dt><dd>${esc(c.term)}</dd></div>
    </dl>
    <p class="hint">${esc(c.hint)}</p>
    <div class="salary">
      <span>연평균 연봉</span>
      <strong id="salVal">? ? ?</strong>
      ${o.status === 'won'
        ? `<button type="button" class="hold" data-hold="1">${esc(S.players[o.p].name)}님만 · 꾹 눌러서 확인</button>`
        : '<span class="lock">낙찰자만 확인할 수 있어요</span>'}
    </div>
    </div>
  </div>`;
}

function bidPanel(c) {
  const btns = S.players.map((p, k) =>
    `<button type="button" data-act="win" data-p="${k}" style="--pc:${PC[k]}"><b>${esc(p.name)}</b><span>큐브 ${p.cubes}개 보유</span></button>`
  ).join('');
  return `<div class="panel">
    <h3>${c.type === 'chance' ? '찬스 카드 경매' : '경매 결과 입력'}</h3>
    <div class="bidRow">
      <label for="bidInput">낙찰 큐브</label>
      <div class="stepper">
        <button type="button" data-act="dec" aria-label="1개 줄이기">−</button>
        <input type="number" id="bidInput" inputmode="numeric" min="1" value="${MIN_BID}">
        <button type="button" data-act="inc" aria-label="1개 늘리기">+</button>
      </div>
      <div class="quick">${[3, 5, 8, 10, 15].map(v => `<button type="button" data-act="set" data-v="${v}">${v}</button>`).join('')}</div>
    </div>
    <div class="winners">${btns}</div>
    <p class="err" id="bidErr"></p>
    <div class="actions">
      <button class="btn" type="button" data-act="pass">유찰 (아무도 입찰 안 함)</button>
      <button class="btn" type="button" data-act="close">나중에 입력</button>
    </div>
  </div>`;
}

function showModal(i) {
  modalIdx = i;
  const c = BY_ID[S.deck[i]];
  const o = S.opened[i];
  let lower = '';
  if (o.status === 'open') {
    if (c.type === 'chance' && c.kind === 'release') {
      relPick = null;
      const boxes = S.players.map((p, k) => `<div class="relBox" data-k="${k}" style="--pc:${PC[k]}">
          <div class="relName"><b>${esc(p.name)}</b><span>큐브 ${p.cubes}개 보유</span></div>
          <div class="stepper">
            <button type="button" data-act="reldec" data-k="${k}" aria-label="1개 줄이기">−</button>
            <input type="number" id="relBid-${k}" inputmode="numeric" min="0" value="0" aria-label="${esc(p.name)} 입찰 큐브">
            <button type="button" data-act="relinc" data-k="${k}" aria-label="1개 늘리기">+</button>
          </div>
          <button type="button" class="relPick" data-act="relpick" data-k="${k}">먼저 포기</button>
        </div>`).join('');
      lower = `<div class="panel">
        <h3>방출 역경매 · 가장 먼저 포기한 사람이 낙찰</h3>
        <p class="rnote">포기한 사람은 큐브를 내지 않고, 나머지 3명은 포기 시점에 입찰한 큐브를 모두 냅니다.</p>
        <div class="relGrid">${boxes}</div>
        <p class="err" id="bidErr"></p>
        <div class="actions">
          <button class="btn" type="button" data-act="close">나중에 입력</button>
          <button class="btn warn" type="button" data-act="relapply">방출 적용</button>
        </div>
      </div>`;
    } else {
      lower = bidPanel(c);
    }
  } else {
    let msg = '';
    if (o.status === 'won') msg = `<b>${esc(S.players[o.p].name)}</b>님이 큐브 ${o.bid}개로 가져갔습니다.`;
    else if (o.status === 'pass') msg = '유찰된 카드입니다.';
    else if (o.status === 'released') msg = o.auto ? `<b>${esc(S.players[o.p].name)}</b>님이 큐브 ${o.bid}개로 낙찰받았지만, 들고 있던 방출 카드 때문에 바로 방출됐습니다.` : '방출된 선수입니다.';
    else if (o.status === 'applied') msg = esc(o.note || '적용 완료');
    lower = `<div class="panel"><p class="status">${msg}</p><div class="actions"><button class="btn primary" type="button" data-act="close">닫기</button></div></div>`;
  }
  document.getElementById('dialog').innerHTML = cardHtml(i) + lower;
  document.getElementById('modal').hidden = false;
}

function showTrade(h, ti) {
  modalIdx = -1;
  const hp = S.players[h];
  const mine = hp.cards.map(id => `<option value="${id}">${esc(BY_ID[id].name)} (${esc(BY_ID[id].team)})</option>`).join('');
  const theirs = S.players.map((p, k) => k === h ? '' : p.cards.map(id => `<option value="${k}:${id}">${esc(p.name)} · ${esc(BY_ID[id].name)}</option>`).join('')).join('');
  let body;
  if (!mine) body = '<p class="status">교환할 내 선수가 아직 없어요. 선수를 영입한 뒤에 사용하세요.</p><div class="actions"><button class="btn primary" type="button" data-act="close">닫기</button></div>';
  else if (!theirs) body = '<p class="status">상대가 보유한 선수가 아직 없어요.</p><div class="actions"><button class="btn primary" type="button" data-act="close">닫기</button></div>';
  else body = `<p class="status"><b>${esc(hp.name)}</b>님의 선수 1명과 상대 선수 1명을 교환합니다. 낙찰 즉시 사용해야 해요.</p>
    <label for="tradeMine">내보낼 내 선수<select id="tradeMine">${mine}</select></label>
    <label for="tradeTheirs">데려올 상대 선수<select id="tradeTheirs">${theirs}</select></label>
    <div class="actions">
      <button class="btn primary" type="button" data-act="dotrade" data-h="${h}" data-ti="${ti}">교환하기</button>
    </div>`;
  document.getElementById('dialog').innerHTML = `<div class="card chanceCard"><div class="cardTop"><span class="badge">찬스 카드</span></div><h2>트레이드권</h2><p class="effect">${esc(BY_ID.trade.effect)}</p></div><div class="panel trade">${body}</div>`;
  document.getElementById('modal').hidden = false;
}

function doTrade(h, ti) {
  const mine = document.getElementById('tradeMine').value;
  const [ks, theirs] = document.getElementById('tradeTheirs').value.split(':');
  const k = +ks;
  commit();
  const hp = S.players[h], op = S.players[k];
  hp.cards = hp.cards.map(x => x === mine ? theirs : x);
  op.cards = op.cards.map(x => x === theirs ? mine : x);
  const t1 = S.deck.indexOf(mine), t2 = S.deck.indexOf(theirs);
  if (S.opened[t1]) S.opened[t1] = Object.assign({}, S.opened[t1], { p: k });
  if (S.opened[t2]) S.opened[t2] = Object.assign({}, S.opened[t2], { p: h });
  if (S.last && S.last.id === mine) S.last = { p: k, id: mine };
  else if (S.last && S.last.id === theirs) S.last = { p: h, id: theirs };
  S.tradeUsed = true;
  const prev = S.opened[ti] || {};
  S.opened[ti] = { status: 'applied', p: h, bid: prev.bid, note: `${hp.name} ${BY_ID[mine].name} ↔ ${op.name} ${BY_ID[theirs].name}` };
  save(); renderAll(); closeModal();
}

function closeModal() { document.getElementById('modal').hidden = true; modalIdx = null; }

function readBid() {
  const v = parseInt(document.getElementById('bidInput').value, 10);
  return Number.isFinite(v) ? v : NaN;
}

function onDialog(e) {
  const t = e.target.closest('[data-act]');
  if (!t) return;
  const act = t.dataset.act;
  const i = modalIdx;
  if (i === null) return;
  if (act === 'close') { closeModal(); return; }
  if (act === 'dotrade') { doTrade(+t.dataset.h, +t.dataset.ti); return; }
  const id = S.deck[i];
  const c = BY_ID[id];
  const input = document.getElementById('bidInput');
  if (act === 'close') { closeModal(); return; }
  if (act === 'dotrade') { doTrade(+t.dataset.h); return; }
  if (act === 'inc' || act === 'dec') { const v = readBid() || 0; input.value = Math.max(+input.min || 0, v + (act === 'inc' ? 1 : -1)); return; }
  if (act === 'set') { input.value = t.dataset.v; return; }
  if (act === 'win') {
    const p = +t.dataset.p;
    const bid = readBid();
    const err = document.getElementById('bidErr');
    if (!(bid >= 1)) { err.textContent = '낙찰 큐브 수를 1개 이상으로 입력하세요.'; return; }
    if (bid > S.players[p].cubes) { err.textContent = `${S.players[p].name}님은 큐브가 ${S.players[p].cubes}개뿐입니다.`; return; }
    commit();
    S.players[p].cubes -= bid;
    if (c.type === 'player') {
      const pr = S.players[p].pendingRelease;
      if (pr !== undefined && pr !== null) {
        S.opened[i] = { status: 'released', p, bid, auto: true };
        S.opened[pr] = Object.assign({}, S.opened[pr], { note: `${S.players[p].name} · ${c.name} 방출` });
        S.players[p].pendingRelease = null;
      } else {
        S.players[p].cards.push(id); S.last = { p, id }; S.opened[i] = { status: 'won', p, bid };
      }
    }
    else if (c.kind === 'trade') {
      const othersHave = S.players.some((q, k) => k !== p && q.cards.length);
      if (!S.players[p].cards.length || !othersHave) {
        S.tradeUsed = true;
        S.opened[i] = { status: 'applied', p, bid, note: `${S.players[p].name} 낙찰 · ${S.players[p].cards.length ? '교환할 상대 선수 없어' : '보유 선수 없어'} 소멸` };
      } else {
        S.opened[i] = { status: 'trading', p, bid };
        save(); renderAll(); showTrade(p, i);
        return;
      }
    }
    else { S.players[p].chances.push(id); S.opened[i] = { status: 'won', p, bid }; }
    save(); renderAll(); showModal(i);
    return;
  }
  if (act === 'pass') {
    commit();
    S.opened[i] = { status: 'pass' };
    save(); renderAll(); closeModal();
    return;
  }
  if (act === 'relpick') {
    relPick = +t.dataset.k;
    document.querySelectorAll('.relBox').forEach(b => {
      const k = +b.dataset.k, on = k === relPick;
      b.classList.toggle('picked', on);
      const inp = document.getElementById('relBid-' + k);
      inp.disabled = on; if (on) inp.value = 0;
    });
    return;
  }
  if (act === 'relinc' || act === 'reldec') {
    const inp = document.getElementById('relBid-' + t.dataset.k);
    if (inp.disabled) return;
    const v = parseInt(inp.value, 10) || 0;
    inp.value = Math.max(0, v + (act === 'relinc' ? 1 : -1));
    return;
  }
  if (act === 'relapply') {
    const err = document.getElementById('bidErr');
    if (relPick === null) { err.textContent = '가장 먼저 포기한 사람을 고르세요.'; return; }
    const bids = S.players.map((q, k) => k === relPick ? 0 : parseInt(document.getElementById('relBid-' + k).value, 10));
    for (let k = 0; k < 4; k++) {
      if (!(bids[k] >= 0)) { err.textContent = `${S.players[k].name}님의 입찰 큐브를 0 이상으로 입력하세요.`; return; }
      if (bids[k] > S.players[k].cubes) { err.textContent = `${S.players[k].name}님은 큐브가 ${S.players[k].cubes}개뿐입니다.`; return; }
    }
    commit();
    S.players.forEach((q, k) => { q.cubes -= bids[k]; });
    const p = relPick;
    const pl = S.players[p];
    let note;
    if (pl.cards.length) {
      const rid = pl.cards.pop();
      const ti = S.deck.indexOf(rid);
      if (S.opened[ti]) S.opened[ti] = Object.assign({}, S.opened[ti], { status: 'released' });
      if (S.last && S.last.id === rid) S.last = null;
      note = `${pl.name} · ${BY_ID[rid].name} 방출`;
    } else {
      pl.pendingRelease = i;
      note = `${pl.name} 낙찰 · 다음 영입 선수 방출 대기`;
    }
    S.opened[i] = { status: 'applied', p, bids, note };
    relPick = null;
    save(); renderAll(); showModal(i);
    return;
  }

  if (act === 'release') {
    const L = S.last;
    commit();
    const pl = S.players[L.p];
    pl.cards = pl.cards.filter(x => x !== L.id);
    const ti = S.deck.indexOf(L.id);
    if (S.opened[ti]) S.opened[ti] = Object.assign({}, S.opened[ti], { status: 'released' });
    S.opened[i] = { status: 'applied', note: `${pl.name} · ${BY_ID[L.id].name} 방출` };
    S.last = null;
    save(); renderAll(); showModal(i);
    return;
  }
  if (act === 'skip') {
    commit();
    S.opened[i] = { status: 'applied', note: '대상 없음' };
    save(); renderAll(); closeModal();
  }
}

/* ---------- Results ---------- */
function doubledId(p) {
  const pl = S.players[p];
  if (!pl.chances.includes('double') || !pl.cards.length) return null;
  return pl.cards.slice().sort((a, b) => BY_ID[a].aav - BY_ID[b].aav)[0];
}
function value(p, id) { return BY_ID[id].aav * (doubledId(p) === id ? 2 : 1); }

function renderResult() {
  const el = document.getElementById('resultView');
  const allCards = S.players.flatMap(p => p.cards);
  const totals = S.players.map((p, k) => p.cards.reduce((s, id) => s + value(k, id), 0));
  const allRevealed = true;
  const order = S.players.map((_, k) => k).sort((a, b) => totals[b] - totals[a]);
  const rankOf = k => order.indexOf(k) + 1;
  const cols = S.players.map((p, k) => {
    const dbl = doubledId(k);
    const list = p.cards.length ? p.cards.map(id => {
      return `<div class="rcard">
        <span>${esc(BY_ID[id].name)}${dbl === id ? '<span class="x2">×2</span>' : ''}</span>
        <span class="v">${dbl === id ? `<small class="orig">${fmt(BY_ID[id].aav)} →</small> ` : ''}${fmt(value(k, id))}</span>
      </div>`;
    }).join('') : '<span class="empty">영입한 선수 없음</span>';
    const notes = [];
    if (p.chances.includes('double')) notes.push('연봉 2배: 최저 연봉 선수에게 적용');
    notes.push(`남은 큐브 ${p.cubes}개 (점수 없음)`);
    return `<div class="rcol ${allRevealed && rankOf(k) === 1 && allCards.length ? 'first' : ''}" style="--pc:${PC[k]}">
      <div class="rname"><b>${esc(p.name)}</b>${allRevealed && allCards.length ? `<span class="rank">${rankOf(k)}위</span>` : ''}</div>
      <div class="rtotal">${fmt(totals[k])}<small>합계</small></div>
      <div class="rlist">${list}</div>
      <div class="rnote">${notes.join(' · ')}</div>
    </div>`;
  }).join('');
  el.innerHTML = `<div class="resultHead">
      <h2>최종 연봉 합산</h2>
    </div>
    <div class="resultGrid">${cols}</div>`;
}

function onResult(e) {
  const t = e.target.closest('[data-ract]');
  if (!t) return;
  const a = t.dataset.ract;
  if (a === 'reveal') { S.revealed[t.dataset.id] = !S.revealed[t.dataset.id]; }
  else if (a === 'all') { S.players.flatMap(p => p.cards).forEach(id => S.revealed[id] = true); }
  else if (a === 'hideall') { S.revealed = {}; }
  save(); renderAll();
}

/* ---------- Wiring ---------- */
document.getElementById('board').addEventListener('click', e => {
  const t = e.target.closest('.tile');
  if (t) openTile(+t.dataset.i);
});
document.getElementById('players').addEventListener('input', e => {
  const t = e.target.closest('.pname');
  if (!t) return;
  S.players[+t.dataset.p].name = t.value.trim() || DEFAULT_NAMES[+t.dataset.p];
  save(); renderBoard();
});
document.getElementById('players').addEventListener('click', e => {
  const t = e.target.closest('[data-trade]');
  if (t) showTrade(+t.dataset.trade);
});
document.getElementById('dialog').addEventListener('click', onDialog);
function showSal(on) {
  const v = document.getElementById('salVal');
  if (!v || modalIdx === null) return;
  const c = BY_ID[S.deck[modalIdx]];
  v.textContent = on && c.type === 'player' ? fmt(c.aav) : '? ? ?';
}
const dlg = document.getElementById('dialog');
dlg.addEventListener('pointerdown', e => { const h = e.target.closest('[data-hold]'); if (!h) return; e.preventDefault(); showSal(true); });
['pointerup', 'pointercancel', 'pointerleave'].forEach(ev => dlg.addEventListener(ev, () => showSal(false)));
dlg.addEventListener('contextmenu', e => { if (e.target.closest('[data-hold]')) e.preventDefault(); });
dlg.addEventListener('keydown', e => { if ((e.key === ' ' || e.key === 'Enter') && e.target.closest('[data-hold]')) { e.preventDefault(); showSal(true); } });
dlg.addEventListener('keyup', e => { if (e.target.closest('[data-hold]')) showSal(false); });
document.getElementById('modal').addEventListener('click', e => { if (e.target.id === 'modal' && modalIdx !== -1) closeModal(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && modalIdx !== null && modalIdx !== -1) closeModal(); });
document.getElementById('resultView').addEventListener('click', onResult);
document.getElementById('undoBtn').addEventListener('click', undo);
document.getElementById('resultBtn').addEventListener('click', () => {
  commit();
  S.phase = S.phase === 'result' ? 'play' : 'result';
  save(); renderAll();
});
let armTimer = null;
document.getElementById('newBtn').addEventListener('click', e => {
  const b = e.currentTarget;
  if (!b.classList.contains('warn')) {
    b.classList.add('warn'); b.textContent = '한 번 더 누르면 새로 섞기';
    clearTimeout(armTimer);
    armTimer = setTimeout(() => { b.classList.remove('warn'); b.textContent = '새 게임'; }, 3000);
    return;
  }
  clearTimeout(armTimer);
  b.classList.remove('warn'); b.textContent = '새 게임';
  commit();
  S = fresh(S.players.map(p => p.name));
  closeModal(); save(); renderAll();
});

S = load();
renderAll();

function fitStage() {
  const st = document.getElementById('stage');
  const W = document.documentElement.clientWidth || window.innerWidth;
  const H = document.documentElement.clientHeight || window.innerHeight;
  const sw = 960, sh = 1060;
  const k = Math.min(W / sw, H / sh);
  st.style.transform = `scale(${k})`;
  st.style.left = Math.max(0, (W - sw * k) / 2) + 'px';
  st.style.top = Math.max(0, (H - sh * k) / 2) + 'px';
}
window.addEventListener('resize', fitStage);
fitStage();

</script>
