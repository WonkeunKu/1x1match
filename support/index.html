<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="icon" href="/icon-ball.ico?v=4" sizes="any">
<link rel="icon" href="/icon-ball-32.png?v=4" type="image/png" sizes="32x32">
<link rel="icon" href="/icon-ball.svg?v=4" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icon-ball-180.png?v=4">
<title>고객 문의 · 1x1 MATCH</title>
<script src="/pv.js?v=1" defer></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Mono:wght@500;600&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* 고객 문의: 좁은 한 줄 양식 (계정 페이지와 같은 칠판 초록). 남긴 글은 대표 계정만 봄 */
:root {
  --board: #10302a; --board-2: #163d35; --slot: #0b2420;
  --chalk: #f1eee4; --chalk-dim: #a7bcb2; --line: rgba(241, 238, 228, 0.14);
  --amber: #f3b641; --red: #e8604a; --ok: #7bd88f;
  --f-display: "Black Han Sans", "Noto Sans KR", "Apple SD Gothic Neo", sans-serif;
  --f-body: "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { background: #071815; }
body {
  margin: 0; min-height: 100vh; color: var(--chalk); font-family: var(--f-body); font-size: 15px; line-height: 1.5;
  background-color: var(--board);
  background-image: repeating-linear-gradient(90deg, transparent 0 79px, rgba(0,0,0,0.1) 79px 80px), repeating-linear-gradient(0deg, transparent 0 79px, rgba(0,0,0,0.08) 79px 80px);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.wrap { max-width: 520px; margin: 0 auto; padding-block: 28px 40px; display: grid; gap: 16px; }
button, textarea, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }
.brand { display: flex; align-items: center; gap: 12px; }
.logo { font-family: var(--f-display); font-size: 28px; line-height: 1; color: var(--chalk); text-decoration: none; padding-right: 12px; border-right: 1px solid var(--line); }
.logo span { color: var(--amber); }
.eyebrow { font-family: var(--f-mono); font-size: 11px; letter-spacing: 0.14em; color: var(--chalk-dim); text-transform: uppercase; }
h1 { font-family: var(--f-display); font-weight: 400; font-size: 32px; line-height: 1.05; margin: 2px 0 0; }
.lede { margin: 0; color: var(--chalk-dim); font-size: 14px; word-break: keep-all; }
form, .done { background: var(--slot); border: 1px solid var(--line); border-radius: 12px; padding: 18px; display: grid; gap: 16px; }
.field { display: grid; gap: 6px; }
.field > label, .field > .lb { font-size: 13px; font-weight: 700; }
.field small { color: var(--chalk-dim); font-size: 12.5px; font-weight: 400; }
.cats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
.cats button { border: 1px solid var(--line); background: var(--board-2); border-radius: 8px; padding: 10px 4px; font-weight: 700; font-size: 14px; color: var(--chalk-dim); word-break: keep-all; }
.cats button[aria-pressed="true"] { background: var(--chalk); color: var(--board); border-color: var(--chalk); }
textarea, input[type=text] { width: 100%; background: var(--board); border: 1px solid var(--line); border-radius: 8px; padding: 12px; font-size: 16px; }
textarea { min-height: 180px; resize: vertical; line-height: 1.55; }
.count { justify-self: end; font-family: var(--f-mono); font-size: 12px; color: var(--chalk-dim); }
.who { font-size: 13px; color: var(--chalk-dim); background: var(--board-2); border-radius: 8px; padding: 10px 12px; }
.who b { color: var(--chalk); }
.who a { color: var(--amber); font-weight: 700; text-decoration: none; }
.hp { position: absolute; left: -9999px; width: 1px; height: 1px; overflow: hidden; }
.btn { border: 1px solid var(--amber); background: var(--amber); color: #1a1405; padding: 13px 14px; border-radius: 8px; font-weight: 700; font-size: 16px; }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn.ghost { background: var(--board-2); color: var(--chalk); border-color: var(--line); }
.err { color: var(--red); font-size: 13px; margin: 0; min-height: 18px; }
.done h2 { font-family: var(--f-display); font-weight: 400; font-size: 24px; margin: 0; color: var(--ok); }
.done p { margin: 0; color: var(--chalk-dim); word-break: keep-all; }
.done .row { display: flex; gap: 8px; flex-wrap: wrap; }
.done .row > * { flex: 1; text-align: center; text-decoration: none; }
.back { color: var(--amber); font-weight: 700; text-decoration: none; font-size: 14px; }
.site-foot { border-top: 1px solid var(--line); padding-top: 14px; display: grid; gap: 4px; font-size: 12.5px; color: var(--chalk-dim); }
.site-foot b { color: var(--chalk); font-weight: 700; }
.site-foot .sep { opacity: .5; margin: 0 6px; }
</style>
</head>
<body>
<div class="wrap">
  <header class="brand"><a class="logo" href="/" aria-label="1x1 MATCH 홈으로">1<span>x</span>1</a><div><div class="eyebrow">1x1 MATCH</div><h1>고객 문의</h1></div></header>
  <p class="lede">궁금한 점, 게임 오류나 불편한 점, 바라는 게임이 있으면 남겨 주세요. 남긴 글은 운영자만 볼 수 있어요.</p>

  <form id="f" novalidate>
    <div class="field"><span class="lb" id="catLb">종류</span>
      <div class="cats" role="group" aria-labelledby="catLb">
        <button type="button" data-c="문의" aria-pressed="true">문의</button>
        <button type="button" data-c="불편·오류" aria-pressed="false">불편·오류</button>
        <button type="button" data-c="제안" aria-pressed="false">제안</button>
        <button type="button" data-c="기타" aria-pressed="false">기타</button>
      </div></div>
    <div class="field"><label for="text">내용</label>
      <textarea id="text" maxlength="2000" placeholder="예) 슬리더링크 15×15에서 확대가 안 돼요. 아이폰 사파리에서 했어요."></textarea>
      <span class="count" id="cnt">0 / 2000</span></div>
    <div class="field"><label for="contact">답변 받을 연락처 <small>(선택 · 이메일이나 전화번호)</small></label>
      <input type="text" id="contact" maxlength="80" autocomplete="email" placeholder="답변이 필요하면 적어 주세요">
      <small>연락처는 이 문의에 답하는 데만 쓰고, 처리가 끝나면 지워요.</small></div>
    <div class="who" id="who">로그인하지 않고도 남길 수 있어요.</div>
    <label class="hp" aria-hidden="true">웹사이트 <input type="text" id="website" tabindex="-1" autocomplete="off"></label>
    <p class="err" id="err" role="alert"></p>
    <button class="btn" id="send" type="submit">문의 남기기</button>
  </form>

  <div class="done" id="done" hidden>
    <h2>잘 받았어요</h2>
    <p>남겨 주셔서 고마워요. 확인하고 필요하면 적어 주신 연락처로 답변드릴게요.</p>
    <div class="row"><button class="btn ghost" type="button" id="more">하나 더 남기기</button><a class="btn" href="/">게임하러 가기</a></div>
  </div>

  <a class="back" href="/">← 홈으로</a>
  <footer class="site-foot">
    <div><b>1x1 MATCH</b><span class="sep">|</span>개인정보 보호책임자 구원근</div>
    <div>전화 010-7334-3125<span class="sep">|</span>이메일 91kwk0208@gmail.com</div>
  </footer>
</div>
<script>
const $ = id => document.getElementById(id);
let cat = '문의', ME = null;
document.querySelector('.cats').addEventListener('click', e => { const b = e.target.closest('[data-c]'); if (!b) return; cat = b.dataset.c; document.querySelectorAll('.cats button').forEach(x => x.setAttribute('aria-pressed', String(x === b))); });
$('text').addEventListener('input', () => { $('cnt').textContent = `${$('text').value.length} / 2000`; $('err').textContent = ''; });
fetch('/api/auth/me', { cache: 'no-store' }).then(r => r.json()).then(d => {
  ME = d.user || null;
  $('who').innerHTML = ME ? `<b>${ME.nickname.replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]))}</b> 님으로 남겨요.` : '로그인하지 않고도 남길 수 있어요. <a href="/account/?next=%2Fsupport%2F">로그인</a>하고 남기면 누가 남겼는지 알 수 있어 답변이 빨라요.';
}).catch(() => {});
$('f').addEventListener('submit', async e => {
  e.preventDefault();
  const text = $('text').value.trim();
  if (text.length < 5) { $('err').textContent = '내용을 5자 이상 적어 주세요.'; $('text').focus(); return; }
  $('send').disabled = true; $('err').textContent = '';
  try {
    const r = await fetch('/api/inquiry', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ cat, text, contact: $('contact').value.trim(), website: $('website').value, page: document.referrer ? new URL(document.referrer).pathname : '' }) });
    const d = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(d.error || '보내지 못했어요. 잠시 뒤에 다시 해 주세요.');
    $('f').hidden = true; $('done').hidden = false; $('done').scrollIntoView({ block: 'nearest' });
  } catch (err) { $('err').textContent = err.message; }
  finally { $('send').disabled = false; }
});
$('more').onclick = () => { $('text').value = ''; $('contact').value = ''; $('cnt').textContent = '0 / 2000'; $('done').hidden = true; $('f').hidden = false; $('text').focus(); };
</script>
</body>
</html>
