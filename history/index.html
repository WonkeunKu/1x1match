<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="icon" href="/favicon.ico?v=3" sizes="any">
<link rel="icon" href="/favicon.svg?v=3" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png?v=3">
<title>내 경기 기록 · 1x1 MATCH</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Mono:wght@500;600&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* Layout: one column (max 860px) on the scoreboard green — summary tiles per game, a filter row, then a dated list of games. Same palette as the game pages. */
:root {
  --board: #10302a; --board-2: #163d35; --slot: #0b2420;
  --chalk: #f1eee4; --chalk-dim: #a7bcb2; --line: rgba(241, 238, 228, 0.14);
  --amber: #f3b641; --red: #e8604a; --blue: #6fc4ea; --green: #a9d774;
  --f-display: "Black Han Sans", "Noto Sans KR", "Apple SD Gothic Neo", sans-serif;
  --f-body: "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { background: #071815; }
body {
  margin: 0; min-height: 100vh; color: var(--chalk); font-family: var(--f-body); font-size: 15px; line-height: 1.45;
  background-color: var(--board);
  background-image: repeating-linear-gradient(90deg, transparent 0 79px, rgba(0,0,0,0.1) 79px 80px), repeating-linear-gradient(0deg, transparent 0 79px, rgba(0,0,0,0.08) 79px 80px);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.wrap { max-width: 860px; margin: 0 auto; padding-block: 24px 48px; display: grid; gap: 16px; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, a:focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }
.brand { display: flex; align-items: center; gap: 12px; }
.logo { font-family: var(--f-display); font-size: 28px; line-height: 1; color: var(--chalk); text-decoration: none; padding-right: 12px; border-right: 1px solid var(--line); }
.logo span { color: var(--amber); }
.eyebrow { font-family: var(--f-mono); font-size: 11px; letter-spacing: 0.14em; color: var(--chalk-dim); text-transform: uppercase; }
h1 { font-family: var(--f-display); font-weight: 400; font-size: 34px; line-height: 1.05; margin: 2px 0 0; }
.muted { color: var(--chalk-dim); font-size: 13px; margin: 0; }
.sum { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 10px; }
.stat { background: var(--slot); border: 1px solid var(--line); border-top: 3px solid var(--c); border-radius: 10px; padding: 12px 14px; display: grid; gap: 4px; }
.stat .t { font-size: 13px; color: var(--chalk-dim); }
.stat .v { font-family: var(--f-mono); font-size: 26px; font-weight: 600; color: var(--c); font-variant-numeric: tabular-nums; }
.stat .s { font-size: 12px; color: var(--chalk-dim); }
.filters { display: flex; gap: 6px; flex-wrap: wrap; }
.filters button { border: 1px solid var(--line); background: var(--slot); border-radius: 999px; padding: 6px 12px; font-size: 13px; font-weight: 700; color: var(--chalk-dim); }
.filters button[aria-pressed="true"] { background: var(--chalk); color: var(--board); border-color: var(--chalk); }
#body:not([hidden]) { display: grid; gap: 12px; }
.tabs button { font-size: 14px; padding: 8px 14px; }
.tabs button[aria-pressed="true"] { background: var(--c, var(--chalk)); border-color: var(--c, var(--chalk)); color: #1a1405; }
.lock { font-size: 11px; font-weight: 700; color: #1a1405; background: #b8a6f2; border-radius: 999px; padding: 1px 7px; margin-left: 4px; }
.list { display: grid; gap: 8px; }
.day { font-family: var(--f-mono); font-size: 12px; color: var(--chalk-dim); margin: 8px 0 0; }
.item { background: var(--slot); border: 1px solid var(--line); border-left: 4px solid var(--c); border-radius: 8px; padding: 10px 12px; display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 12px; align-items: center; }
.badge { font-family: var(--f-display); font-size: 18px; min-width: 52px; text-align: center; padding: 6px 8px; border-radius: 8px; background: var(--board-2); }
.badge.win { background: var(--amber); color: #1a1405; }
.badge.lose { color: var(--chalk-dim); }
.item .g { font-weight: 700; }
.item .d { font-size: 13px; color: var(--chalk-dim); overflow: hidden; text-overflow: ellipsis; }
.item .r { font-family: var(--f-mono); font-size: 18px; font-weight: 600; text-align: right; white-space: nowrap; }
.item .r small { display: block; font-family: var(--f-body); font-size: 11px; color: var(--chalk-dim); font-weight: 400; }
.empty { background: var(--slot); border: 1px dashed var(--line); border-radius: 10px; padding: 24px; text-align: center; display: grid; gap: 10px; justify-items: center; }
.empty a, .go { color: var(--amber); font-weight: 700; text-decoration: none; }
.foot { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
.btn { border: 1px solid var(--line); background: var(--board-2); padding: 8px 12px; border-radius: 8px; font-size: 13px; font-weight: 700; }
.btn.warn { background: var(--red); border-color: var(--red); color: #fff; }
.links { display: inline-flex; gap: 14px; flex-wrap: wrap; }
.links a, .links button { color: var(--amber); font-weight: 700; text-decoration: none; background: none; border: 0; padding: 0; font-size: 14px; }
</style>
</head>
<body>
<div class="wrap">
  <header class="brand"><a class="logo" href="/" aria-label="1x1 MATCH 홈으로">1<span>x</span>1</a><div><div class="eyebrow">1x1 MATCH</div><h1>내 경기 기록</h1></div></header>
  <p class="muted" id="who">기록을 불러오는 중…</p>
  <section class="empty" id="needLogin" hidden><b>로그인해야 경기 기록을 볼 수 있어요</b><span class="muted">로그인한 상태로 끝까지 한 경기가 여기에 쌓여요. 로그인하지 않아도 게임은 할 수 있어요.</span><div class="links"><a href="/account/?next=/history/">로그인</a><a href="/account/?tab=signup&amp;next=/history/">회원가입</a></div></section>
  <div id="body" hidden>
  <section class="sum" id="sum" aria-label="게임별 요약"></section>
  <div class="filters tabs" id="gameTabs" role="group" aria-label="게임 고르기"></div>
  <div class="filters" id="modeTabs" role="group" aria-label="경기 방식 거르기"></div>
  <section class="list" id="list" aria-live="polite"></section>
  </div>
  <div class="foot"><a class="go" href="/">← 게임 하러 가기</a><span class="links" id="acct"></span></div>
</div>
<script>
let DATA = [], ADMIN = false;
const LV = { low: '하', mid: '중', high: '상', easy: '쉬움', normal: '보통', hard: '어려움' };
const esc = s => String(s ?? '').replace(/[&<>"]/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[ch]));
const fmt = v => { const r = Math.round(v * 100) / 100; return (Number.isInteger(r) ? String(r) : r.toFixed(2).replace(/0$/, '')) + '억'; };
const tm = ms => { if (ms == null) return '–'; const s = Math.floor(ms / 1000), m = Math.floor(s / 60); return String(m).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0') + '.' + Math.floor(ms % 1000 / 100); };
// 게임별 기록: 게임 탭 → 경기 방식
const GAMES = [
  { id: 'auction', short: '경매', name: '연봉 블라인드 경매', c: 'var(--amber)', modes: [['online', '사람과'], ['ai', 'AI와']] },
  { id: 'bw', short: '흑과 백', name: '9이닝 홈런 흑과 백', c: 'var(--blue)', modes: [['online', '사람과'], ['ai', 'AI와']] },
  { id: 'slither', short: '슬리더링크', name: '슬리더링크', c: '#b8a6f2', modes: [['solo', '혼자'], ['battle', '기록 대결']] },
  { id: 'wallgo1', short: '벽바둑 Ⅰ', name: '벽바둑 Ⅰ', c: '#f0a35e', modes: [['online', '온라인'], ['local', '이 기기']] },
  { id: 'wallgo', short: '벽바둑 Ⅱ', name: '벽바둑 Ⅱ', c: '#e7a0c8', modes: [['online', '온라인'], ['local', '이 기기']] }
];
const G_BY = Object.fromEntries(GAMES.map(g => [g.id, g]));
let game = 'all', mode = 'all';
const visibleGames = () => GAMES.filter(g => !g.admin || ADMIN || DATA.some(x => x.game === g.id));
const modeText = x => {
  if (x.game === 'auction') return x.mode === 'ai' ? `AI 대전 · ${LV[x.level] || '중'}` : '온라인 4인';
  if (x.game === 'bw') return x.mode === 'ai' ? `AI 대전 · ${LV[x.level] || '중'}` : '온라인 1:1';
  if (x.game === 'slither') return (x.mode === 'battle' ? `기록 대결 ${x.total}명` : '혼자 풀기') + ` · ${x.size}×${x.size}`;
  if (x.game === 'wallgo' || x.game === 'wallgo1') return (x.mode === 'online' ? `온라인 ${x.total}인` : `이 기기 ${x.total}인`) + (x.level ? ` · AI ${LV[x.level]}` : '');
  return '';
};
function statCard(g, list) {
  const L = list.filter(x => x.game === g.id);
  let v = '기록 없음', sub = `${L.length}판`;
  if (g.id === 'auction' && L.length) {
    v = `우승 ${L.filter(x => x.rank === 1).length}회`;
    sub = `${L.length}판 · 평균 ${(L.reduce((s, x) => s + x.rank, 0) / L.length).toFixed(1)}위 · 최고 ${fmt(Math.max(...L.map(x => x.score)))}`;
  } else if (g.id === 'bw' && L.length) {
    const w = L.filter(x => x.result === 'win').length, l = L.filter(x => x.result === 'lose').length, d = L.filter(x => x.result === 'draw').length;
    v = `${w}승 ${l}패${d ? ` ${d}무` : ''}`; sub = `${L.length}판 · 승률 ${Math.round(w / L.length * 100)}%`;
  } else if (g.id === 'slither' && L.length) {
    const ok = L.filter(x => x.result === 'solved');
    const best = [5, 7, 10].map(n => { const t = ok.filter(x => x.size === n).map(x => x.time); return t.length ? `${n}×${n} ${tm(Math.min(...t))}` : null; }).filter(Boolean);
    v = `${ok.length}번 풀이`; sub = (best.length ? '최고 ' + best.join(' · ') : `${L.length}판`) + (L.some(x => x.mode === 'battle') ? ` · 대결 1위 ${L.filter(x => x.mode === 'battle' && x.rank === 1).length}회` : '');
  } else if ((g.id === 'wallgo' || g.id === 'wallgo1') && L.length) {
    v = `1위 ${L.filter(x => x.rank === 1).length}회`;
    sub = `${L.length}판 · 평균 ${(L.reduce((s, x) => s + x.rank, 0) / L.length).toFixed(1)}위 · 최고 ${Math.max(...L.map(x => x.score))}칸`;
  }
  return `<div class="stat" style="--c:${g.c}"><span class="t">${g.name}${g.admin ? '<span class="lock">관리자</span>' : ''}</span><span class="v">${v}</span><span class="s">${sub}</span></div>`;
}
function summary(all) {
  const gs = game === 'all' ? visibleGames() : [G_BY[game]];
  let html = gs.map(g => statCard(g, all)).join('');
  if (game === 'all') html += `<div class="stat" style="--c:var(--green)"><span class="t">전체</span><span class="v">${all.length}판</span><span class="s">${visibleGames().map(g => `${g.short} ${all.filter(x => x.game === g.id).length}`).join(' · ')}</span></div>`;
  document.getElementById('sum').innerHTML = html;
}
function itemHtml(x) {
  const t = new Date(x.at).toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit' });
  const g = G_BY[x.game] || { name: x.game, c: 'var(--chalk-dim)' };
  const head = `<div class="g">${g.name} <span class="muted">· ${modeText(x)} · ${t}</span></div>`;
  if (x.game === 'auction') {
    const others = (x.players || []).filter(p => !p.me).sort((a, b) => b.score - a.score).map(p => `${esc(p.name)} ${fmt(p.score)}`).join(' · ');
    const mine = (x.mine || []).map(p => esc(p.name)).join(', ') || '선수 없음';
    return `<div class="item" style="--c:${g.c}"><span class="badge ${x.rank === 1 ? 'win' : ''}">${x.rank}위</span>
      <div>${head}<div class="d">내 선수: ${mine}</div><div class="d">${others}</div></div>
      <div class="r">${fmt(x.score)}<small>${x.total}명 중</small></div></div>`;
  }
  if (x.game === 'bw') {
    const label = x.result === 'win' ? '승' : x.result === 'lose' ? '패' : '무';
    return `<div class="item" style="--c:${g.c}"><span class="badge ${x.result}">${label}</span>
      <div>${head}<div class="d">상대: ${esc(x.opponent)} · ${x.innings}이닝</div></div>
      <div class="r">${x.myWins} : ${x.oppWins}<small>나 : 상대</small></div></div>`;
  }
  if (x.game === 'slither') {
    const solved = x.result === 'solved';
    const badge = x.mode === 'battle' ? (solved ? `${x.rank}위` : '포기') : (solved ? '완료' : '포기');
    const win = x.mode === 'battle' ? x.rank === 1 : solved;
    const others = x.mode === 'battle' ? (x.players || []).filter(p => !p.me).map(p => `${esc(p.name)} ${p.status === 'done' ? tm(p.time) : '포기'}`).join(' · ') : '';
    return `<div class="item" style="--c:${g.c}"><span class="badge ${win ? 'win' : 'lose'}">${badge}</span>
      <div>${head}${others ? `<div class="d">${others}</div>` : `<div class="d">${solved ? '정답을 맞혔어요' : '정답 보기로 확인'}</div>`}</div>
      <div class="r">${solved ? tm(x.time) : '–'}<small>${solved ? '풀이 시간' : '기록 없음'}</small></div></div>`;
  }
  if (x.game === 'wallgo' || x.game === 'wallgo1') {
    const others = (x.players || []).filter(p => !p.me).sort((a, b) => a.rank - b.rank).map(p => `${esc(p.name)}${p.ai ? '(AI)' : ''} ${p.score}칸`).join(' · ');
    return `<div class="item" style="--c:${g.c}"><span class="badge ${x.rank === 1 ? 'win' : ''}">${x.rank}위</span>
      <div>${head}<div class="d">${others}</div></div>
      <div class="r">${x.score}칸<small>가장 큰 영역 ${x.best}칸</small></div></div>`;
  }
  return '';
}
function renderTabs() {
  const vg = visibleGames();
  if (game !== 'all' && !vg.some(g => g.id === game)) game = 'all';
  document.getElementById('gameTabs').innerHTML = `<button type="button" data-g="all" aria-pressed="${game === 'all'}">전체</button>` +
    vg.map(g => `<button type="button" data-g="${g.id}" style="--c:${g.c}" aria-pressed="${game === g.id}">${g.name}</button>`).join('');
  const mt = document.getElementById('modeTabs');
  const modes = game === 'all' ? [] : G_BY[game].modes;
  mt.hidden = !modes.length;
  mt.innerHTML = modes.length ? `<button type="button" data-m="all" aria-pressed="${mode === 'all'}">전체</button>` + modes.map(([m, l]) => `<button type="button" data-m="${m}" aria-pressed="${mode === m}">${l}</button>`).join('') : '';
}
function render() {
  renderTabs();
  summary(DATA);
  const list = DATA.filter(x => (game === 'all' || x.game === game) && (mode === 'all' || x.mode === mode));
  const el = document.getElementById('list');
  if (!list.length) {
    el.innerHTML = `<div class="empty"><b>${DATA.length ? '이 조건의 기록이 없어요' : '아직 기록이 없어요'}</b><span class="muted">경기를 끝까지 하면 결과가 여기에 자동으로 쌓여요.</span><a href="/">게임 고르러 가기 →</a></div>`;
  } else {
    let html = '', day = '';
    for (const x of list) {
      const d = new Date(x.at).toLocaleDateString('ko-KR', { year: 'numeric', month: 'long', day: 'numeric', weekday: 'short' });
      if (d !== day) { html += `<p class="day">${d}</p>`; day = d; }
      html += itemHtml(x);
    }
    el.innerHTML = html;
  }
}
document.getElementById('gameTabs').addEventListener('click', e => { const b = e.target.closest('[data-g]'); if (!b) return; game = b.dataset.g; mode = 'all'; try { history.replaceState(null, '', game === 'all' ? location.pathname : '#' + game); } catch {} render(); });
document.getElementById('modeTabs').addEventListener('click', e => { const b = e.target.closest('[data-m]'); if (!b) return; mode = b.dataset.m; render(); });
async function start() {
  try {
    const r = await fetch('/api/history', { cache: 'no-store' });
    if (r.status === 401) { document.getElementById('who').hidden = true; document.getElementById('needLogin').hidden = false; return; }
    const d = await r.json();
    DATA = d.history || []; ADMIN = !!(d.user && d.user.admin);
    const h = location.hash.replace('#', ''); if (G_BY[h]) game = h;
    document.getElementById('who').innerHTML = `<b>${esc(d.user.nickname)}</b>님의 경기 기록이에요. 로그인한 상태로 끝까지 한 경기만 쌓여요.`;
    document.getElementById('acct').innerHTML = '<button type="button" id="logoutBtn">로그아웃</button>';
    document.getElementById('logoutBtn').onclick = async () => { await fetch('/api/auth/logout', { method: 'POST' }).catch(() => {}); location.reload(); };
    document.getElementById('body').hidden = false;
    render();
  } catch (e) { console.error(e); document.getElementById('who').textContent = '기록을 불러오지 못했어요. 잠시 뒤 새로고침해 주세요.'; }
}
start();
</script>
</body>
</html>
