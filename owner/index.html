<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<link rel="icon" href="/icon-ball.ico?v=4" sizes="any">
<link rel="icon" href="/icon-ball-32.png?v=4" type="image/png" sizes="32x32">
<link rel="icon" href="/icon-ball.svg?v=4" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icon-ball-180.png?v=4">
<title>회원 관리 · 1x1 MATCH</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Mono:wght@500;600&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* Layout: same scoreboard green as the games. Stats row, then two tabs (members / access log). Members are a table on wide screens and cards on phones. */
:root {
  --board: #10302a; --board-2: #163d35; --slot: #0b2420;
  --chalk: #f1eee4; --chalk-dim: #a7bcb2; --line: rgba(241, 238, 228, 0.14);
  --amber: #f3b641; --red: #e8604a; --blue: #6fc4ea; --green: #a9d774; --purple: #b8a6f2;
  --f-display: "Black Han Sans", "Noto Sans KR", "Apple SD Gothic Neo", sans-serif;
  --f-body: "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { background: #071815; }
body { margin: 0; min-height: 100vh; color: var(--chalk); font-family: var(--f-body); font-size: 15px; line-height: 1.45;
  background-color: var(--board);
  background-image: repeating-linear-gradient(90deg, transparent 0 79px, rgba(0,0,0,.1) 79px 80px), repeating-linear-gradient(0deg, transparent 0 79px, rgba(0,0,0,.08) 79px 80px);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.wrap { max-width: 1180px; margin: 0 auto; padding-block: 18px 40px; display: grid; gap: 14px; }
.brand { display: flex; align-items: center; gap: 12px; }
.brand > div { min-width: 0; flex: 1; }
.logo { font-family: var(--f-display); font-size: 26px; line-height: 1; color: var(--chalk); text-decoration: none; padding-right: 12px; border-right: 1px solid var(--line); white-space: nowrap; flex: none; }
.logo span { color: var(--amber); }
.eyebrow { font-family: var(--f-mono); font-size: 11px; letter-spacing: .14em; color: var(--chalk-dim); text-transform: uppercase; }
h1 { font-family: var(--f-display); font-weight: 400; font-size: 34px; line-height: 1.05; margin: 2px 0 0; }
.tag { flex: none; font-size: 12px; font-weight: 700; color: #1a1405; background: var(--amber); border-radius: 999px; padding: 3px 10px; }
.muted { color: var(--chalk-dim); font-size: 13px; margin: 0; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 10px; }
.stat { background: var(--slot); border: 1px solid var(--line); border-top: 3px solid var(--c); border-radius: 10px; padding: 12px 14px; display: grid; gap: 2px; }
.stat .t { font-size: 13px; color: var(--chalk-dim); }
.stat .v { font-family: var(--f-mono); font-size: 28px; font-weight: 600; color: var(--c); font-variant-numeric: tabular-nums; }
.stat .s { font-size: 12px; color: var(--chalk-dim); }
.bar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.tabs { display: flex; gap: 6px; }
.tabs button { border: 1px solid var(--line); background: var(--slot); border-radius: 999px; padding: 8px 14px; font-size: 14px; font-weight: 700; color: var(--chalk-dim); }
.tabs button[aria-pressed="true"] { background: var(--chalk); color: var(--board); border-color: var(--chalk); }
.bar .sp { flex: 1; }
.bar input, .bar select { background: var(--slot); border: 1px solid var(--line); border-radius: 8px; padding: 9px 12px; font-size: 15px; }
.bar input { min-width: 0; width: 240px; max-width: 100%; }
.panel { background: var(--slot); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; }
th { font-size: 12px; color: var(--chalk-dim); font-weight: 700; background: rgba(0,0,0,.18); position: sticky; top: 0; }
tbody tr:hover { background: rgba(241,238,228,.04); }
td.num, th.num { text-align: right; font-family: var(--f-mono); }
.mono { font-family: var(--f-mono); }
.nick { font-weight: 700; }
.role { font-size: 11px; font-weight: 700; border-radius: 999px; padding: 1px 7px; margin-left: 6px; color: #1a1405; }
.role.owner { background: var(--amber); }
.role.admin { background: var(--purple); }
.dim { color: var(--chalk-dim); }
.games { font-size: 12px; color: var(--chalk-dim); }
.scroll { overflow-x: auto; }
.ev { display: grid; grid-template-columns: 120px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 10px 14px; border-bottom: 1px solid var(--line); }
.ev:last-child { border-bottom: 0; }
.ev .when { font-family: var(--f-mono); font-size: 13px; color: var(--chalk-dim); }
.ev .kind { font-size: 12px; font-weight: 700; border-radius: 999px; padding: 2px 9px; background: var(--board-2); color: var(--chalk-dim); white-space: nowrap; }
.ev .kind.login { background: var(--green); color: #14200c; }
.day { font-family: var(--f-mono); font-size: 12px; color: var(--chalk-dim); padding: 10px 14px 4px; background: rgba(0,0,0,.18); }
.vis { display: grid; gap: 12px; }
.vis .row2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 12px; }
.vis .box { background: var(--slot); border: 1px solid var(--line); border-radius: 10px; padding: 14px; display: grid; gap: 10px; min-width: 0; }
.vis h3 { margin: 0; font-size: 14px; color: var(--chalk-dim); font-weight: 700; }
.chart { display: grid; grid-template-columns: repeat(14, minmax(0, 1fr)); gap: 6px; align-items: end; height: 150px; }
.chart .col { display: flex; flex-direction: column-reverse; gap: 2px; height: 100%; justify-content: flex-start; align-items: stretch; position: relative; }
.chart .seg { border-radius: 3px; min-height: 0; }
.chart .g { background: var(--blue); } .chart .m { background: var(--amber); }
.chart .n { position: absolute; left: 0; right: 0; text-align: center; font-family: var(--f-mono); font-size: 11px; color: var(--chalk); }
.days { display: grid; grid-template-columns: repeat(14, minmax(0, 1fr)); gap: 6px; font-family: var(--f-mono); font-size: 10px; color: var(--chalk-dim); text-align: center; }
.legend { display: flex; gap: 14px; font-size: 12px; color: var(--chalk-dim); }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
.hb { display: grid; grid-template-columns: minmax(90px, 32%) 1fr auto; gap: 10px; align-items: center; font-size: 14px; }
.hb .track, .hb .fill { display: block; }
.hb .track { height: 10px; background: var(--board-2); border-radius: 999px; overflow: hidden; }
.hb .fill { height: 100%; background: var(--green); border-radius: 999px; }
.hb .c { font-family: var(--f-mono); font-size: 13px; color: var(--chalk-dim); }
.vlist { display: grid; }
.vlist .ev { grid-template-columns: 110px minmax(0, 1fr) auto; padding: 8px 0; }
.vlist .ev .kind { justify-self: end; }
@media (max-width: 720px) { .vlist .ev { grid-template-columns: minmax(0, 1fr) auto; gap: 2px 10px; } .vlist .ev .when { grid-column: 1 / -1; } }
.empty { padding: 28px 16px; text-align: center; color: var(--chalk-dim); }
.note { font-size: 12px; color: var(--chalk-dim); }
/* phone: member rows become cards */
@media (max-width: 720px) {
  h1 { font-size: 28px; }
  .bar input { width: 100%; flex: 1 1 100%; }
  table, thead, tbody, tr, td { display: block; }
  thead { display: none; }
  tr { padding: 12px 14px; border-bottom: 1px solid var(--line); display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; }
  td { border: 0; padding: 0; white-space: normal; }
  td[data-k]::before { content: attr(data-k) " "; color: var(--chalk-dim); font-size: 12px; }
  td.c-nick { grid-column: 1 / -1; font-size: 16px; }
  td.num { text-align: left; }
  .ev { grid-template-columns: 1fr auto; }
  .ev .when { grid-column: 1 / -1; }
}
</style>
</head>
<body>
<div class="wrap">
  <header class="brand"><a class="logo" href="/" aria-label="1x1 MATCH 홈으로">1<span>x</span>1</a><div><div class="eyebrow">1x1 MATCH · 대표 계정</div><h1>회원 관리</h1></div><span class="tag">대표 전용</span></header>
  <p class="muted" id="msg">불러오는 중…</p>
  <section class="stats" id="stats" aria-label="요약"></section>
  <div class="bar">
    <div class="tabs" role="group" aria-label="보기">
      <button type="button" data-t="users" aria-pressed="true">회원 목록</button>
      <button type="button" data-t="events" aria-pressed="false">접속 기록</button>
      <button type="button" data-t="visitors" aria-pressed="false">방문자</button>
    </div>
    <span class="sp"></span>
    <input id="q" type="search" placeholder="닉네임·이름·전화번호 검색" autocomplete="off" aria-label="검색">
    <select id="sort" aria-label="정렬">
      <option value="joined">가입 최신순</option>
      <option value="seen">최근 접속순</option>
      <option value="games">경기 많은 순</option>
    </select>
  </div>
  <section class="panel" id="usersView"><div class="scroll"><table>
    <thead><tr><th>닉네임</th><th>이름</th><th>전화번호</th><th>가입일</th><th>최근 접속</th><th class="num">로그인</th><th class="num">경기</th><th>게임별</th></tr></thead>
    <tbody id="users"></tbody>
  </table></div></section>
  <section class="panel" id="eventsView" hidden></section>
  <section id="visitorsView" class="vis" hidden></section>
  <p class="note">이 페이지는 대표 계정(010-7334-3125)으로 로그인했을 때만 열려요. 회원의 이름과 전화번호가 보이니 화면을 다른 사람에게 보여 줄 때 주의하세요. 접속 기록은 로그인할 때와, 로그인한 채로 다시 들어올 때(3시간에 한 번) 남아요.</p>
</div>
<script>
let D = { users: [], events: [] }, tab = 'users';
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"]/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[ch]));
const phone = p => { p = String(p || ''); return p.length === 11 ? `${p.slice(0, 3)}-${p.slice(3, 7)}-${p.slice(7)}` : p.length === 10 ? `${p.slice(0, 3)}-${p.slice(3, 6)}-${p.slice(6)}` : p; };
const GN = { auction: '경매', bw: '흑과 백', slither: '슬리더링크', wallgo: '벽바둑' };
const dt = v => v ? new Date(v).toLocaleString('ko-KR', { year: '2-digit', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' }) : '–';
function ago(v) {
  if (!v) return '–';
  const m = Math.floor((Date.now() - new Date(v)) / 60000);
  if (m < 1) return '방금'; if (m < 60) return m + '분 전';
  const h = Math.floor(m / 60); if (h < 24) return h + '시간 전';
  const d = Math.floor(h / 24); return d < 30 ? d + '일 전' : dt(v);
}
const isToday = v => v && new Date(v).toDateString() === new Date().toDateString();
function stats() {
  const U = D.users, E = D.events, week = Date.now() - 7 * 864e5;
  const todayUsers = new Set(E.filter(e => isToday(e.at)).map(e => e.nickname)).size;
  const weekUsers = new Set(E.filter(e => new Date(e.at) >= week).map(e => e.nickname)).size;
  $('stats').innerHTML = [
    ['전체 회원', U.length + '명', `관리자 ${U.filter(u => u.admin).length}명 포함`, 'var(--amber)'],
    ['오늘 가입', U.filter(u => isToday(u.created_at)).length + '명', `최근 7일 ${U.filter(u => new Date(u.created_at) >= week).length}명`, 'var(--blue)'],
    ['오늘 접속', todayUsers + '명', `최근 7일 ${weekUsers}명`, 'var(--green)'],
    ['총 경기', U.reduce((s, u) => s + u.games, 0) + '판', '로그인하고 끝까지 한 경기', 'var(--purple)']
  ].map(([t, v, s, c]) => `<div class="stat" style="--c:${c}"><span class="t">${t}</span><span class="v">${v}</span><span class="s">${s}</span></div>`).join('');
}
const match = (q, ...xs) => !q || xs.some(x => String(x || '').toLowerCase().includes(q));
function renderUsers() {
  const q = $('q').value.trim().toLowerCase().replace(/-/g, '');
  const s = $('sort').value;
  const list = D.users.filter(u => match(q, u.nickname.toLowerCase(), u.name, u.phone)).slice();
  if (s === 'seen') list.sort((a, b) => new Date(b.lastSeen || 0) - new Date(a.lastSeen || 0));
  else if (s === 'games') list.sort((a, b) => b.games - a.games);
  $('users').innerHTML = list.length ? list.map(u => `<tr>
    <td class="c-nick"><span class="nick">${esc(u.nickname)}</span>${u.owner ? '<span class="role owner">대표</span>' : u.admin ? '<span class="role admin">관리자</span>' : ''}</td>
    <td data-k="이름">${esc(u.name)}</td>
    <td data-k="전화" class="mono">${esc(phone(u.phone))}</td>
    <td data-k="가입" class="dim">${dt(u.created_at)}</td>
    <td data-k="최근 접속">${ago(u.lastSeen)}</td>
    <td data-k="로그인" class="num">${u.logins}</td>
    <td data-k="경기" class="num">${u.games}</td>
    <td class="games">${Object.entries(u.byGame || {}).map(([g, n]) => `${GN[g] || g} ${n}`).join(' · ') || '–'}</td>
  </tr>`).join('') : `<tr><td class="empty" colspan="8">${D.users.length ? '검색 결과가 없어요' : '아직 가입한 회원이 없어요'}</td></tr>`;
}
function renderEvents() {
  const q = $('q').value.trim().toLowerCase();
  const list = D.events.filter(e => match(q, e.nickname.toLowerCase(), e.name));
  if (!list.length) { $('eventsView').innerHTML = `<div class="empty">${D.events.length ? '검색 결과가 없어요' : '아직 접속 기록이 없어요'}</div>`; return; }
  let html = '', day = '';
  for (const e of list) {
    const d = new Date(e.at).toLocaleDateString('ko-KR', { month: 'long', day: 'numeric', weekday: 'short' });
    if (d !== day) { html += `<div class="day">${d}</div>`; day = d; }
    html += `<div class="ev"><span class="when">${new Date(e.at).toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit' })}</span>
      <span><b>${esc(e.nickname)}</b> <span class="dim">${esc(e.name)} · ${esc(e.device || '기기 정보 없음')}</span></span>
      <span class="kind ${e.kind}">${e.kind === 'login' ? '로그인' : '다시 들어옴'}</span></div>`;
  }
  $('eventsView').innerHTML = html;
}
const short = v => { const d = new Date(v); return `${d.getMonth() + 1}.${d.getDate()} ${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`; };
function renderVisitors() {
  const V = D.visitors;
  if (!V) { $('visitorsView').innerHTML = '<div class="panel"><div class="empty">방문자 정보를 불러오지 못했어요</div></div>'; return; }
  const days = V.days.slice().reverse(), mx = Math.max(1, ...days.map(d => d.all));
  const bars = days.map(d => `<div class="col" title="${d.day} · ${d.all}명 (비회원 ${d.guest} · 회원 ${d.member})"><span class="seg g" style="height:${d.guest / mx * 88}%"></span><span class="seg m" style="height:${d.member / mx * 88}%"></span><span class="n" style="bottom:${Math.min(d.all / mx * 88, 88) + 2}%">${d.all || ''}</span></div>`).join('');
  const labels = days.map(d => `<span>${+d.day.slice(8)}</span>`).join('');
  const hb = (list, total) => list.length ? list.map(x => `<div class="hb"><span>${esc(x.name)}</span><span class="track"><span class="fill" style="width:${x.count / Math.max(1, list[0].count) * 100}%"></span></span><span class="c">${x.count}명</span></div>`).join('') : '<p class="muted">아직 기록이 없어요</p>';
  const rec = V.recent.length ? V.recent.map(r => `<div class="ev"><span class="when">${short(r.at)}</span><span><b>${r.nickname ? esc(r.nickname) : '비회원'}</b> <span class="dim">${esc(r.page || '')} · ${esc(r.device || '기기 정보 없음')}${r.region ? ' · ' + esc(r.region) : ''}</span></span><span class="kind ${r.nickname ? 'login' : ''}">${r.nickname ? '회원' : '비회원'}</span></div>`).join('') : '<p class="muted">아직 기록이 없어요</p>';
  $('visitorsView').innerHTML = `
    <section class="stats">
      <div class="stat" style="--c:var(--green)"><span class="t">오늘 방문자</span><span class="v">${V.today.all}명</span><span class="s">비회원 ${V.today.guest} · 회원 ${V.today.member}</span></div>
      <div class="stat" style="--c:var(--blue)"><span class="t">최근 7일 방문자</span><span class="v">${V.week.all}명</span><span class="s">그중 비회원 ${V.week.guest}명</span></div>
      <div class="stat" style="--c:var(--amber)"><span class="t">회원 비율 (7일)</span><span class="v">${V.week.all ? Math.round((V.week.all - V.week.guest) / V.week.all * 100) : 0}%</span><span class="s">로그인한 채로 들어온 사람</span></div>
    </section>
    <div class="box"><h3>최근 14일 방문자</h3><div class="chart">${bars}</div><div class="days">${labels}</div>
      <div class="legend"><span><i style="background:var(--blue)"></i>비회원</span><span><i style="background:var(--amber)"></i>회원</span></div></div>
    <div class="row2">
      <div class="box"><h3>많이 들어간 곳 (7일, 사람 수)</h3>${hb(V.pages)}</div>
      <div class="box"><h3>기기 (7일, 사람 수)</h3>${hb(V.devices)}</div>
    </div>
    <div class="box"><h3>지역 (7일, 사람 수)</h3>${hb(V.regions || [])}<p class="muted" style="margin:8px 0 0;font-size:12px">인터넷 주소로 짐작한 대략적인 지역이에요. 휴대폰 데이터로 들어오면 실제 위치와 상관없이 서울·경기로 잡히는 경우가 많아요. 지역 기능을 만든 뒤 방문부터 보여요. 지역 정보: <a href="https://db-ip.com" target="_blank" rel="noopener" style="color:inherit">IP Geolocation by DB-IP</a></p></div>
    <div class="box"><h3>최근 방문</h3><div class="vlist">${rec}</div></div>
    <p class="note">같은 브라우저는 하루에 한 사람으로 세요. 브라우저를 바꾸거나 시크릿 창으로 들어오면 다른 사람으로 세어질 수 있어요. 이름·전화번호 같은 개인정보와 인터넷 주소(IP)는 저장하지 않고, 짐작한 지역 이름만 남겨요.</p>`;
}
function render() {
  $('usersView').hidden = tab !== 'users'; $('eventsView').hidden = tab !== 'events'; $('visitorsView').hidden = tab !== 'visitors';
  $('sort').hidden = tab !== 'users'; $('q').hidden = tab === 'visitors';
  if (tab === 'users') renderUsers(); else if (tab === 'events') renderEvents(); else renderVisitors();
}
document.querySelector('.tabs').addEventListener('click', e => { const b = e.target.closest('[data-t]'); if (!b) return; tab = b.dataset.t; document.querySelectorAll('[data-t]').forEach(x => x.setAttribute('aria-pressed', String(x === b))); render(); });
$('q').addEventListener('input', render);
$('sort').addEventListener('change', render);
async function load() {
  try {
    const r = await fetch('/api/owner/overview', { cache: 'no-store' });
    if (!r.ok) throw new Error('불러오지 못했어요');
    D = await r.json();
    $('msg').textContent = `${new Date().toLocaleString('ko-KR')} 기준 · 새로고침하면 최신으로 바뀌어요`;
    stats(); render();
  } catch (e) { $('msg').textContent = '정보를 불러오지 못했어요. 잠시 뒤 새로고침해 주세요.'; }
}
load();
</script>
